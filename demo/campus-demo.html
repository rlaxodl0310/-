function spokenTopicClause(subject,detail,{why=false}={}){
 const voice=conversationVoices[subject.id],index=Math.max(0,subject.detail.indexOf(detail));
 if(voice)return voice[why?'why':'say'][index%voice.say.length];
 if(why)return subject.continuations?.[index%subject.continuations.length]??'그쪽이 저는 좀 더 편하더라고요.';
 return subject.observations?.[index%subject.observations.length]??subject.continuations?.[0]??'저는 일단 해보고 생각하려고요.';
}

const abilityNames={strength:'힘',agility:'민첩',vitality:'체력',endurance:'인내',mentality:'정신력'};

const neutralAbilities={strength:4,agility:4,vitality:4,endurance:4,mentality:4};
function normalizeAbilities(value={}){return Object.fromEntries(Object.keys(abilityNames).map(k=>[k,Number.isFinite(value[k])?Math.max(1,Math.min(abilityMaximums[k],Math.round(value[k]))):4]));}
function characterAbilities(id){return abilityProfiles[id]?Object.fromEntries(Object.keys(abilityNames).map((k,i)=>[k,abilityProfiles[id][i]])):{...neutralAbilities};}
function savedCharacterAbilities(state,id){return normalizeAbilities(state.characterSystem?.profiles?.[id]??characterAbilities(id));}
function entityAbilities(entity){return normalizeAbilities(entity?.attributes??neutralAbilities);}
function rarityForAbilities(stats){const score=Object.values(normalizeAbilities(stats)).reduce((a,b)=>a+b,0);const tier=score>=35?4:score>=30?3:score>=25?2:score>=20?1:0;return {score,tier,label:['보통','드문 편','희귀','매우 희귀','극히 희귀'][tier],probability:[.95,.8,.6,.4,.2][tier]};}
function abilityPenaltyFactors(entity){const a=entityAbilities(entity);return {endurance:Math.max(.4,Math.min(1.18,1-(Math.min(10,a.endurance)-4)*.06-Math.max(0,a.endurance-10)*.006)),mentality:Math.max(.38,Math.min(1.21,1-(Math.min(10,a.mentality)-4)*.07-Math.max(0,a.mentality-10)*.005)),effort:Math.max(.5,Math.min(1.15,1-(Math.min(10,a.vitality)-4)*.05-Math.max(0,a.vitality-10)*.005))};}
function attributeEffortCost(entity,base){return Math.max(1,Math.round(base*abilityPenaltyFactors(entity).effort));}
function attributeMoveRange(entity){const a=entityAbilities(entity);return a.agility>=7?4:a.agility<=2?2:3;}
function attributeAttackChance(entity){const a=entityAbilities(entity),f=abilityPenaltyFactors(entity);return Math.max(.25,Math.min(.97,.92+(a.strength-4)*.015+(a.agility-4)*.01-((entity.fear??0)/300+(entity.wounds??0)*.05)*f.mentality));}

// Counter-based deterministic rolls: rendering never consumes a random stream.
function abilityAppearanceRoll(seed,id){let h=seed>>>0;for(const c of id)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;h=Math.imul(h^(h>>>16),0x7feb352d);h=Math.imul(h^(h>>>15),0x846ca68b);return ((h^(h>>>16))>>>0)/4294967296;}
function initializeCharacterSystem(state,{seed=state.campusVariation?.seed??417193,protagonist='taei'}={}){
 if(state.characterSystem)return state;
 const profiles=Object.fromEntries(characterAbilityIds.map(id=>[id,characterAbilities(id)]));
 state.characterSystem={version:2,seed:seed>>>0,protagonist,profiles,initialProfiles:structuredClone(profiles),potentials:Object.fromEntries(characterAbilityIds.map(id=>[id,characterPotential(id)])),practice:{},presence:Object.fromEntries(characterAbilityIds.map(id=>[id,id===protagonist||abilityAppearanceRoll(seed,id)<rarityForAbilities(profiles[id]).probability]))};return state;
}
function characterPresent(state,id){
 if(!id||id==='taei'||id===state.characterSystem?.protagonist)return true;
 // Established contacts/events survive old-save migration and retained relationships.
 if(state.contacts?.[id]?.seen||state.contacts?.[id]?.introduced)return true;
 return state.characterSystem?.presence?.[id]!==false;
}
function enabledAttributes(state,id){return state.characterSystem?{attributes:savedCharacterAbilities(state,id)}:{};}

// Potential is an individual ceiling, not a current ability or a recruitment promise.
function characterPotential(id){return Object.fromEntries(Object.keys(abilityNames).map((key,i)=>[key,potentialProfiles[id]?.[i]??abilityMaximums[key]]));}
function savedCharacterPotential(state,id){const current=savedCharacterAbilities(state,id),raw=state.characterSystem?.potentials?.[id]??characterPotential(id);return Object.fromEntries(Object.keys(abilityNames).map(key=>[key,Math.max(current[key],normalizeAbilities(raw)[key])]));}
function gainCharacterPractice(state,id,key,amount=1){
 if(!state.characterSystem||!abilityNames[key]||!Number.isFinite(amount)||amount<=0)return 0;
 const system=state.characterSystem;system.initialProfiles??=structuredClone(system.profiles);system.potentials??=Object.fromEntries(characterAbilityIds.map(id=>[id,characterPotential(id)]));system.practice??={};
 const current=savedCharacterAbilities(state,id),cap=savedCharacterPotential(state,id)[key];system.profiles[id]=current;system.practice[id]??={};
 let xp=(system.practice[id][key]??0)+Math.min(20,amount),gained=0;
 while(current[key]<cap&&xp>=10+current[key]*2){xp-=10+current[key]*2;current[key]++;gained++;}
 system.practice[id][key]=current[key]>=cap?0:xp;
 for(const member of state.survivalRun?.members??[])if(member.character===id)member.attributes={...current};
 return gained;
}
function characterStartingRarity(state,id){return rarityForAbilities(state.characterSystem?.initialProfiles?.[id]??savedCharacterAbilities(state,id));}

 const strained=ids.some(a=>ids.some(b=>a!==b&&overlap(a,b)&&(s.relations[a+'>'+b]?.tension??0)>=4));

 g.result={shared:'수량과 남은 일을 서로 확인하고 인수인계까지 정리했다.',practical:'먼저 끝낼 수 있는 포장을 마쳤다. 세부 인수인계는 다음에 더 맞추기로 했다.',limited:'가능한 물품부터 마무리하고 남은 일은 표시해 두었다.',separate:'각자 맡은 구역을 따로 끝냈다. 기준을 맞추는 일은 남아 있다.','solo-burden':'태이가 남은 정리를 많이 맡아 일을 마쳤지만 과정과 책임이 한 사람에게 몰렸다.'}[g.outcome];

// Observe state changes; looking at a resource never grants ownership of it.
function discoveryChanges(before,after){
 const changes=(after.known??[]).filter(x=>!(before.known??[]).includes(x)).map(name=>({kind:'information',name}));
 for(const item of after.inventory??[]){
  const previous=(before.inventory??[]).find(x=>x.id===item.id)?.quantity??0;
  if(item.quantity>previous)changes.push({kind:'item',name:item.name,quantity:item.quantity-previous});
 }
 return changes;
}
function recordDiscoveries(before,after,action=''){
 const changes=discoveryChanges(before,after);

 for(const change of changes)after.discoveries.push({...change,action,day:after.day,phase:before.phase,location:before.phase!==after.phase?'activity':after.location});
 return changes;
}

function noteWarning(s,{id,label,detail,source,kind='direct'}){

 if(w.evidence.some(e=>e.key===key))return false;
 w.evidence.push({key,id,label,detail,source,kind,day:s.day,phase:s.phase});
 if(!s.known.includes(label))s.known.push(label);
 s.memory.push(`[${s.day}일차] ${label} · ${source}: ${detail}`);return true;
}

function learnIdentity(s,id,source,level='full'){

 if(c.nameLevel!=='full')c.nameLevel=level;
 if(!c.sources.some(x=>x.source===source&&x.day===(s.day??1)))c.sources.push({source,day:s.day??1,phase:s.phase});

function normalizeNpcAddress(s,id,text){if(contact(s,id).playerSeniorityKnown)return String(text??'');const address=contact(s,id).playerNameKnown?'태이 씨':'그쪽';return String(text??'').replace(/(?:김태이|태이)\s*선배(?:님)?/g,address).replace(/선배(?:님)?/g,address);}

const lifeProfiles={
 yeogyeong:{load:1.15,sensitivity:0.9,recovery:1,baseline:8},
 seoyeon:{load:0.95,sensitivity:1,recovery:1.2,baseline:4},
 soyul:{load:1,sensitivity:1.25,recovery:0.85,baseline:11}
};
const bound=n=>Math.max(0,Math.min(100,Math.round(n)));
function npcNow(s,id){
 const profile=lifeProfiles[id];if(!profile)throw new Error('알 수 없는 인물입니다.');
 const minute=s.clock?.minute??(s.phase==='evening'?1140:780),day=s.day??1;
 const lessons=timetable(s,id),next=lessons.find(c=>c.end>minute),inClass=next&&minute>=next.start;
 const until=next?next.start-minute:null;
 const classLoad=lessons.reduce((n,c)=>n+Math.max(0,Math.min(minute,c.end)-c.start),0);
 // Off-screen ordinary breaks are assumed; player absence does not starve NPCs.
 const resting=id==='seoyeon'?minute>=840&&minute<900:minute>=780&&minute<810;
 let fatigue=Math.max(0,minute-540)*0.055+classLoad*0.1*profile.load-(resting?12*profile.recovery:0);
 let stress=profile.baseline+(inClass?30:until!==null&&until>=0&&until<=20?48:0);
 const tension=s.relations?.[`${id}>taei`]?.tension??0;
 stress+=tension*6;
 const peers=Object.entries(s.relations??{}).filter(([k])=>k.startsWith(id+'>')&&!k.endsWith('>taei'));
 stress+=peers.reduce((n,[,r])=>n+(r.tension??0)*3,0);
 const task=day===1&&id==='yeogyeong'&&minute>=840&&minute<1080||day===3&&minute>=810&&minute<1080;
 if(task)stress+=18;
 const weather=weatherNow(s).kind;
 if(weather==='storm')stress+=8;
 if(day===3&&(s.warnings?.evidence?.length??0)>0)stress+=10;
 let warmth=0;
 const recent=[];
 for(const e of s.npcLife?.events??[]){
  if(e.person!==id)continue;
  const age=(day-e.day)*1440+minute-e.minute;if(age<0||age>=240)continue;
  const factor=1-age/240;fatigue+=(e.fatigue??0)*factor;stress+=(e.stress??0)*factor*profile.sensitivity;warmth+=(e.warmth??0)*factor;recent.push(e.kind);
 }
 fatigue=bound(fatigue);stress=bound(stress);warmth=Math.round(warmth);
 const rushed=!!inClass||until!==null&&until>=0&&until<=20;
 const mood=rushed?'rushed':stress>=55?'overwhelmed':fatigue>=50?'drained':warmth>=8&&stress<40?'bright':resting?'resting':task?'focused':'steady';
 return {minute,day,fatigue,stress,warmth,mood,rushed,resting,task,until,next:next?.name??null,recent,
  bandwidth:rushed?'brief':stress>=55||fatigue>=50?'limited':'open',
  disclosure:stress<45&&fatigue<50&&!rushed,
  cue:{rushed:'가방 끈을 고쳐 잡으며 시계를 거듭 확인한다.',overwhelmed:id==='soyul'?'대답하기 전 화면을 끄고 손에 쥔 휴대폰을 꼭 잡는다.':'말을 꺼내려다 멈추고 눈앞의 자료부터 한쪽으로 모은다.',drained:'눈가를 문지르고 자세를 고쳐 앉는다. 대답 사이의 간격이 평소보다 길다.',bright:id==='soyul'?'눈이 마주치자 먼저 짧게 웃는다.':'하던 일을 잠시 내려놓고 먼저 고개를 든다.',resting:'기대 앉은 자세를 그대로 두고 천천히 고개를 든다.',focused:'말을 듣는 동안에도 손가락은 하던 곳에 끼워두고 있다.',steady:'발소리가 들리자 하던 일에서 시선을 든다.'}[mood]};
}
function noteNpcExperience(s,id,kind,effect={},key=kind){
 s.npcLife??={events:[],seen:{}};s.npcLife.events??=[];s.npcLife.seen??={};
 const stamp=`${s.day}:${id}:${key}`;if(s.npcLife.seen[stamp])return false;
 s.npcLife.seen[stamp]=true;
 s.npcLife.events.push({person:id,day:s.day??1,minute:s.clock?.minute??780,kind,...effect});
 // Keep a compact history, with separate deduplication keys for the short prototype.
 s.npcLife.events=s.npcLife.events.filter(e=>(s.day??1)-e.day<=1).slice(-120);return true;
}
function conversationExperience(s,id,choice,key){
 const impatient=['push','decide','speakFor','rush','insist','force','ctxInsist'].includes(choice);
 const considerate=['space','respect','autonomy','quiet','wait','apologize','repair','ctxSpace','ctxListen'].includes(choice);
 const supported=['help','together','mutual','share','ctxHelp'].includes(choice);
 if(impatient)noteNpcExperience(s,id,'pressured',{stress:20,warmth:-8},key);
 else if(considerate)noteNpcExperience(s,id,'given-space',{stress:-8},key);
 else if(supported)noteNpcExperience(s,id,'supported',{stress:-10,warmth:10},key);
}

// A transparent decision model for authored NPC behavior, not a language model.
function socialIntent(s,id){
 const state=npcNow(s,id);
 const r={familiarity:0,affection:0,trust:0,tension:0,...s.relations[`${id}>taei`]};
 const memories=s.dialogue?.observations?.[id]??{};
 const history=s.dialogue?.history??[];
 const brokenDays=[];
 if(s.dialogue?.promises[id]==='broken')brokenDays.push(s.day??1);
 if(s.dayHistory?.at(-1)?.promises[id]==='broken')brokenDays.push(s.dayHistory.at(-1).day);
 for(const a of s.appointments??[])if(a.person===id&&a.status==='broken'&&!a.repairedAt)brokenDays.push(a.day);
 const brokenDay=brokenDays.length?Math.max(...brokenDays):0;
 const apology=history.findLast(h=>h.person===id&&(h.choice==='repair'||h.choice==='scene:apologize')&&((h.day??1)>brokenDay||((h.day??1)===brokenDay&&h.phase==='evening')));
 const unresolved=!!brokenDay&&!apology;
 const feelsSafe=r.trust>=3&&r.tension<3&&!unresolved&&memories.boundary!=='ignored'&&state.disclosure;
 const personallyInterested=r.affection>=3;
 const comfortable=r.familiarity>=4;
 const workPressure=(s.day??1)===3&&s.phase==='afternoon'||state.rushed;
 const mode=r.tension>=4||unresolved?'guarded':workPressure?'task':feelsSafe&&personallyInterested?'seek-company':personallyInterested?'cautious-interest':comfortable?'casual':'polite';
 return {state,mode,feelsSafe,personallyInterested,comfortable,unresolved,workPressure,
  willingToJoke:comfortable&&r.tension<3&&!unresolved&&state.bandwidth==='open',
  invite:comfortable&&r.trust>=2&&r.tension<3&&!unresolved&&state.bandwidth==='open',
  disclosure:feelsSafe?(comfortable?'personal':'limited'):'surface',
  // Kept inside simulation state/tests; numerical reasoning is not shown as mind-reading UI.
  motives:{finishTask:workPressure?4:1,shareTime:personallyInterested?3:1,protectPrivacy:feelsSafe?0:3}};
}

// Persistent consequences, not random paraphrases. Reading never consumes a thread.
function followupCandidate(s,id){
 const thread=s.dialogue?.threads?.[id];
 if(!thread||thread.episode>=2)return null;
 const elapsed=((s.day??1)-thread.day)*1440+(s.clock?.minute??780)-thread.minute;
 return elapsed>=30?thread:null;
}
function rememberConversation(s,id,session){

  s.dialogue.threads[id]={...previous,episode:(previous?.episode??0)+1,day:s.day??1,minute:s.clock?.minute??780};
 }else if(session.variant!=='guarded'&&!previous){
  s.dialogue.threads[id]={episode:0,day:s.day??1,minute:s.clock?.minute??780,origin:session.node};
 }
}

function prepareCampusVariation(s){

 s.campusVariation??={seed:(Math.floor(Math.random()*4294967295)||1),plans:{}};
 if(s.campusVariation.plans[s.day])return s;
 const next=()=>{let x=s.campusVariation.seed;x^=x<<13;x^=x>>>17;x^=x<<5;s.campusVariation.seed=x>>>0||1;return s.campusVariation.seed/4294967296;};
 const options={yeogyeong:['hall','library','cafeteria'],seoyeon:['cafe','hall','cafeteria'],soyul:['library','hall','cafe']};
 const plan={};
 for(const [id,places] of Object.entries(options))plan[id]=[840,900,960,1020,1080,1140,1200,1260].map(start=>({start,end:start+60,location:places[Math.floor(next()*places.length)],reason:['break','errand','own-work'][Math.floor(next()*3)],offset:Math.floor(next()*3)*10}));
 s.campusVariation.plans[s.day]=plan;return s;
}
function variedCampusSchedule(s,base){

  const window=windows.find(w=>minute>=w.start+w.offset&&minute<w.end+w.offset);
  if(window)result[id]=window.location;
 }
 return result;
}

function usesGeneratedDialogue(s){return s.dialogue?.engine==='generative'||s.dialogue?.engine!=='authored'&&s.academics?.enabled===true;}
function generationStore(s){
 s.dialogue.generation??={rng:(Math.floor(Math.random()*4294967295)||1),sequence:0,recent:{}};
 return s.dialogue.generation;
}
function dialogueRandom(store){let x=store.rng>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;store.rng=x>>>0||1;return store.rng/4294967296;}
function selectDialoguePart(store,items){return items[Math.floor(dialogueRandom(store)*items.length)];}
function weightedDialoguePart(store,items){let cursor=dialogueRandom(store)*items.reduce((n,x)=>n+x.weight,0);for(const item of items){cursor-=item.weight;if(cursor<0)return item.value;}return items.at(-1).value;}
function generatedMemory(s,id){
 const facts=s.dialogue.facts?.[id]??{};
 const candidates=[];
 if(facts.coffee)candidates.push({id:'coffee',text:facts.coffee==='black'?'안 단 커피가 좋다고 했죠.':'단 걸 좋아한다고 했죠.'});
 if(facts.photo)candidates.push({id:'photo',text:'전에 같이 사진을 본 적도 있으니까요.'});
 if(s.dialogue.generation?.sharedWork?.includes(id))candidates.push({id:'shared-work-story',text:'선배도 자기 이야기를 곡으로 남기고 싶다고 했잖아요.'});

 else body=`<article class="shelter-card"><h2>생존 기록</h2>${r.history.slice().reverse().map(h=>`<p><small>사태 ${h.day}일차</small> · ${shelterEsc(h.text)}</p>`).join('')||'<p>첫날의 기록이 막 시작됐어요.</p>'}</article>`;

  body=(r.base?renderShelterScene(r,selectedFacility,true):'')+renderSurvivalVitals(state)+incidentPanel+report+body+next;

 return `<section class="shelter-shell">${head}${top}${error?`<p class="shelter-error" role="alert">${shelterEsc(error)}</p>`:''}<section class="shelter-last" aria-live="polite">${shelterEsc(r.log.join(' '))}</section>${pack&&!busy&&tab!=='bag'?`<aside class="pack-shortcut"><span>${pack.stats.name} · ${pack.stats.usedSlots}/${pack.stats.slots}칸 · ${(pack.stats.weight/1000).toFixed(2)}kg${pack.pending?' · 발견 물자 정리 필요':''}</span>${shelterButton(pack.pending?'발견 물자 확인':'가방 열기','survivalTab','bag')}</aside>`:''}${['overview','parties'].includes(tab)?partyDelayPanel(state):''}${tab==='overview'?survivalThinkingSummary(state)+advicePanel+supplyDebriefPanel(state):''}${body}<p class="shelter-note">생존 흐름 시제품 · 학교생활 기록과 분리됩니다. 탐색 가능한 16개 공간의 상태는 플레이마다 달라져요. 일부 원정은 공통 전투 배치를 사용하며, 보건실·매점·편의점은 별도 배치로 진행해요.</p></section>`;

const lootEsc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function combatExtrasPanel(b){
 const quests=combatSideMissions(b);if(!quests.length)return '';
 const completed=quests.filter(q=>q.status==='complete').length;
 return `<details class="tactical-sidequests"><summary>서브미션 · 선택 목표 ${b.status==='active'?'':completed+'/'+quests.length}<small>${b.shop||b.clinic?'물자함 확인은 필수 · 다른 목표는 선택':'놓쳐도 주 임무 성공 가능 · 달성하면 추가 전리품'}</small></summary>${quests.map(q=>`<article data-sidequest="${q.id}" data-side-status="${q.status}"><strong>${q.status==='complete'?'✓ ':q.status==='missed'?'— ':''}${q.label}</strong><p>${b.status==='failed'?'임무 실패 · 보상 없음':q.progress}</p><span>${q.reward.length?'보너스 · '+combatLootLabel(q.reward):'구조 성공 시 거점 인원에 합류'}</span>${b.status==='active'&&q.id==='cache'&&!b.supplyCache?.recovered?'<button data-action="combatLocateLoot">상자 위치 보기</button>':''}</article>`).join('')}</details>`;
}
function combatStashPanel(b){
 if(!b?.stash||b.survivalPack)return '';
 return `<details class="combat-stash"><summary>전리품 보관함 · 다음 임무에서도 사용</summary>${Object.entries(combatLootItems).map(([id,item])=>`<p><b>${item.name} ×${b.stash.items[id]??0}</b><small>${id==='parts'&&b.survivalSortie?'거점 복귀 후 시설 공사에 사용':item.use}</small></p>`).join('')}</details>`;
}
function combatRewardPanel(b){
 if(!b?.optional)return '';
 const r=b.rewardResult;if(!r?.settled)return '';
 return `<section class="combat-rewards" data-reward-status="${r.success?'secured':'lost'}"><h3>${r.success?b.survivalPack?'확보 물자 골라 담기':'전리품 확보':b.survivalPack?'임무 보너스 없음':'물자를 확보하지 못했다'}</h3><p>${r.success?'기본 보상 · 정비 부품 ×1':b.survivalPack?'임무 보너스는 없지만 이미 가방에 챙긴 물자는 가져갈 수 있어요.':'주 임무를 실패해 회수한 물자와 서브미션 보상은 지급되지 않았어요.'}</p>${r.success?`<p class="combat-reward-total">${b.survivalPack?'확보 물자 · 골라 담기':'이번 임무 획득'} · ${lootEsc(combatLootLabel(r.items))}</p><p>${b.survivalPack?'가방 패널에서 챙길 물건을 선택하세요. 남겨 둔 물자는 복귀하면 포기해요.':'보관함에 반영했어요.'} ${b.survivalSortie?b.survivalPack?'복귀 후 가방에서 공동 보관함으로 옮길 수 있어요.':'복귀하면 휴대 물자와 전리품을 거점 창고에 반영해요.':'생수와 붕대는 다음 임무에서 사용할 수 있어요.'}</p>`:''}${combatExtrasPanel(b)}${combatStashPanel(b)}</section>`;
}
function combatCacheMarker(b,busy){const c=b.supplyCache;if(!c)return '';return `<button class="tactical-supply ${c.recovered?'supply-taken':''}" data-action="combatLoot" data-cache="${c.id}" style="left:${(c.x+.5)*100/12}%;top:${(c.y+.8)*100/8}%" aria-label="${c.recovered?'물자 회수 완료':'서브미션 물자 상자 · 인접해 회수 · 행동력 1'}" title="${b.shop?'진열대 옆에서 식품·생수 확인 · 가방에 담은 물자만 확보':'물자 상자에 인접해 회수하면 클리어 시 붕대 2개와 생수 1병 확보'}" ${busy||c.recovered||b.status!=='active'?'disabled':''}><svg viewBox="0 0 32 28" aria-hidden="true" shape-rendering="crispEdges"><path fill="#302b24" d="M2 7h28v19H2z"/><path fill="#bc9256" d="M4 9h24v14H4z"/><path fill="#725337" d="M4 2h24v9H4z"/><path fill="#e4c88a" d="M6 4h20v4H6zM8 11h3v12H8zM22 11h3v12h-3z"/><path fill="#e8dfb2" d="M14 10h5v7h-5z"/></svg><span>${c.recovered?'✓ 회수':'! 물자'}</span></button>`;}

const combatLootItems={water:{name:'생수',use:'전투 중 스태미나·목마름 회복'},bandage:{name:'붕대',use:'전투 중 찰과상 1회 치료'},parts:{name:'정비 부품',use:'보관용 · 제작 기능은 추후 연결'}};
function createCombatExtras(previous,mission){
 const stash=structuredClone(previous?.stash??{runs:0,items:{water:0,bandage:0,parts:0},claimed:[]});stash.runs=(stash.runs??0)+1;stash.items??={};for(const id of Object.keys(combatLootItems))stash.items[id]??=0;stash.claimed??=[];

}
function combatTeamHurt(b){return !!b.optional?.teamHurt||Object.entries(b.actors).some(([key,a])=>a.wounds>(b.optional?.initialWounds?.[key]??0));}
function combatSideMissions(b){
 if(!b?.optional)return [];
 const mission=b.mission??'escape',special=mission==='protect'?{id:'ward',label:'보호 대상 추가 부상 없이 지키기',condition:(b.protection?.wounds??0)===0,progress:`추가 부상 ${b.protection?.wounds??0}회 · 0회 목표`,reward:[{id:'bandage',quantity:1}]}:mission==='eliminate'?{id:'quick',label:'6턴 이내 복도 확보',condition:b.turn<=6,progress:`현재 ${b.turn}/6턴`,reward:[{id:'parts',quantity:3}]}:{id:'quiet',label:'증원을 부르지 않고 탈출',condition:b.noise<6&&!b.reinforced,progress:`소음 ${b.noise}/6 미만`,reward:[{id:'parts',quantity:2}]};

async function animateGridCombat(root,frames){
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)return;
 const board=root.querySelector('.tactical-board');if(!board)return;const rect=board.getBoundingClientRect(),cw=rect.width/12,ch=rect.height/8;
 // Rewind every mover before playing the enemy-turn sequence so units do not teleport first.
 for(const frame of frames.filter(f=>f.kind==='move')){const unit=board.querySelector(`[data-unit="${frame.unit}"] .tactic-walker`);if(unit)unit.style.transform=`translate(${(frame.from.x-frame.to.x)*cw}px,${(frame.from.y-frame.to.y)*ch}px)`;}
 for(const frame of frames)if(frame.defeated||frame.down)board.querySelector(`[data-unit="${frame.target}"]`)?.classList.remove('unit-down');
 for(const frame of frames){
  const unit=board.querySelector(`[data-unit="${frame.unit}"]`),walker=unit?.querySelector('.tactic-walker');if(!walker)continue;
  if(frame.kind==='move'){
   walker.classList.add('is-walking');const points=[frame.from,...frame.path.map(([x,y])=>({x,y}))];const anim=walker.animate(points.map(p=>({transform:`translate(${(p.x-frame.to.x)*cw}px,${(p.y-frame.to.y)*ch}px)`})),{duration:Math.max(180,frame.path.length*170),easing:'linear',fill:'forwards'});await anim.finished.catch(()=>{});walker.style.transform='';walker.classList.remove('is-walking');anim.cancel();
  }else if(frame.kind==='strike'){
   const target=board.querySelector(`[data-unit="${frame.target}"]`),r=unit.getBoundingClientRect(),tr=target?.getBoundingClientRect(),dx=tr?(tr.x-r.x)*.25:8,dy=tr?(tr.y-r.y)*.25:0;
   const hit=walker.animate([{transform:'translate(0,0)'},{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:260});
   if(target){const badge=document.createElement('span');badge.className='tactical-impact';badge.textContent=frame.defeated?'제압':frame.down?'쓰러짐':frame.hit?'타격':'방어 · 회피';target.append(badge);target.querySelector('.tactic-sprite')?.animate([{filter:'brightness(1)'},{filter:'brightness(2.5)'},{filter:'brightness(1)'}],{duration:250});setTimeout(()=>badge.remove(),600);}
   await hit.finished.catch(()=>{});if(frame.defeated||frame.down)target?.classList.add('unit-down');
  }else{await walker.animate([{filter:'brightness(1)'},{filter:'brightness(1.7)'},{filter:'brightness(1)'}],{duration:200}).finished.catch(()=>{});}
 }
}

  const friendly=known&&(id==='taei'||((relation.familiarity??0)>=6&&(relation.trust??0)>=4));
  const row=sdGuarded(state,id,actors)?2:friendly&&['happy','warm'].includes(acting.emotion)?1:0;
  const index=sdActorOrder.indexOf(id),atlas=id==='chaewon'?'chaewon':index<6?'main':index<9?'fair':'fair-extra';
  return {id,atlas,column:index<6?index:(index-6)%3,row,label:displayName(state,id),reaction:row===2?'경계하는 반응':row===1?'편안한 반응':'조심스럽게 반응',speaking:id===activeActor};
 });

}

 'taei:3':{person:'taei',episode:3,previous:'taei:2',title:'끝내는 것도 연습',places:['arts','music','cafe','library'],intro:'고칠 곳을 표시한 데모 메모가 어느새 한 페이지를 넘겼다. 작은 수정만 더 하면 될 것 같은데, 그 작은 수정 때문에 남에게 들려줄 시점이 계속 미뤄진다.',opening:'이걸 완성이라고 부르려면, 어디에서 멈춰야 하지.',options:[['limit','오늘 바꿀 구간을 딱 하나만 정한다.','가장 걸리는 후렴 한 구간만 남기고 나머지는 오늘 건드리지 않기로 했다. 좋아질 가능성과 끝없이 미룰 이유를 구분해봤다.'],['listen','수정하지 않고 처음부터 끝까지 들어본다.','고칠 부분을 찾느라 잊고 있던 곡의 흐름이 들렸다. 처음 적었던 한 줄이 아직 가운데 남아 있었다.'],['story','처음 이 곡으로 하고 싶었던 말을 다시 읽는다.','좋은 소리를 내고 싶었던 건 맞지만, 그보다 먼저 내 이야기를 남기고 싶었다. 처음 메모에서 지금 곡에 없는 문장을 찾았다.']],second:[['version','지금 버전을 날짜와 함께 보관하고 다음 수정은 따로 시작한다.','완성도가 마음에 안 들어도, 오늘 만든 건 남겨두자.','현재 버전을 작업 기록으로 구분했다. 실제 음원 발매를 자동 처리하지 않고 다음에 이어갈 수정 메모를 남겼다.'],['question','누군가에게 들려줄 때 묻고 싶은 질문 하나를 적는다.','잘했는지만 묻기보다, 이야기가 전해졌는지 듣고 싶다.','데모를 아직 공개하지 않고 피드백 질문을 정리했다. 다음에 들려줄 준비와 실제 공개를 구분했다.']],callback:'멈춘 지점을 남겨둔 덕분에, 다음 작업을 처음부터 다시 시작하지 않아도 됐다.'},
 'yeogyeong:2':{person:'yeogyeong',episode:2,previous:'yeogyeong',title:'계획에 없던 간식 시간',places:['hall','cafeteria','cafe','library'],intro:'여경이 작은 과자 봉지를 꺼내더니 태이를 보고 웃는다. “이건 공용 물품 아니고 제가 산 거예요.” 먼저 선을 긋는 말투가 어쩐지 장난스럽다.',opening:'오늘은 계산기 안 켜려고요. 근데 하나씩 세어 먹으면 좀 이상해 보이겠죠?',options:[['taste','맛을 맞히는 작은 놀이를 하자고 한다.','설명 듣고 맞히기예요? 그러면 제가 일부러 어렵게 설명할 수도 있는데.'],['fair','누가 더 먹었는지 세지 말고 편하게 나누자고 웃는다.','아, 그 말은 제가 할 줄 알았는데 먼저 하시네요. 오늘은 진짜 안 셀 거예요.'],['break','과자보다 먼저, 오늘은 무슨 일로 쉬러 왔는지 묻는다.','딱히 큰일이 있어야 쉬는 건 아니잖아요. 저도 그냥 과자 먹고 싶어서 나온 거예요.']],second:[['play','서로 과자 맛을 엉뚱하게 설명하며 잠깐 웃는다.','태이 씨 설명은 맛보다 노래 제목 같아요. 먹어봐도 무슨 말인지 모르겠는데.','정답이나 양을 겨루지 않고 간식을 나누며 쉬었다. 여경의 꼼꼼한 모습과 다른 가벼운 장난을 알게 됐다.'],['quiet','오늘은 일을 꺼내지 않고 편하게 쉬는 시간으로 남긴다.','그럼 오늘 이 시간은 아무 일 안 한 걸로 해요. 기록 안 해도 기억하면 되니까.','새 부탁을 만들지 않고 짧은 휴식을 함께했다. 현장에서 나눈 간식을 개인 소지품으로 추가하지 않았다.']],callback:'그날 과자 설명, 나중에 생각하니까 더 이상하던데요. 아직도 무슨 맛인지 모르겠어요.'},
 'yeogyeong:3':{person:'yeogyeong',episode:3,previous:'yeogyeong:2',title:'이번에는 내가 도와줄게요',places:['hall','library','cafeteria','cafe'],intro:'태이가 작업 메모와 강의 자료를 번갈아 펼치자 여경이 먼저 말을 건다. 무슨 문제인지 듣기도 전에 손을 뻗지는 않고, 옆자리에서 기다린다.',opening:'항상 제 쪽만 같이 봤잖아요. 오늘은 태이 씨가 어디서 막혔는지 들어봐도 돼요?',options:[['accept','지금 헷갈리는 일 하나만 골라 설명하고 도움을 받아본다.','아, 다 해달라는 말은 아니군요. 그럼 제가 들은 순서대로 한번 정리해볼게요.'],['scope','내가 맡을 부분과 함께 봐줬으면 하는 부분을 나눈다.','그렇게 말해 주니까 오히려 편해요. 어디까지 도와야 하는지 모르면 저도 괜히 더 하게 되거든요.'],['refuse','내 일이니 혼자 하면 된다며 바로 거절한다.','혼자 할 수 있는 건 알아요. 할 수 있느냐랑, 같이 하고 싶으냐는 조금 다른 얘기라서요.']],second:[['share','정리한 순서를 받아 적고 서로 맡을 일을 작게 나눈다.','이 정도면 저도 부담 없어요. 다 맡기라는 말은 아니었으니까.','태이는 실제로 받은 도움을 인정하고 남은 일은 직접 정리했다. 여경은 도움을 주고받는 범위를 말로 확인했다.'],['thanks','대신 해결해 달라고 하지 않고 들어준 것에 고맙다고 말한다.','그 정도는 받아도 돼요. 고맙다는 말까지 들으면 저도 괜히 뿌듯하거든요.','문제를 전부 해결했다고 과장하지 않고, 이야기하며 정리된 부분만 남겼다. 태이가 혼자 감당하려는 습관을 돌아봤다.']],callback:'지난번처럼 어디까지 같이 볼지 말해 주면, 다음에도 도와주기 편할 것 같아요.'},
 'seoyeon:2':{person:'seoyeon',episode:2,previous:'seoyeon',title:'뜻밖의 승부욕',places:['hall','cafe','cafeteria','library'],intro:'쉬는 시간, 서연이 태이와 같은 쪽으로 종이를 집으려다 손을 거둔다. “가위바위보 할까요?” 차분하게 제안했는데 시선은 생각보다 진지하다.',opening:'진 사람이 테이블 정리하기요. 돈 거는 건 말고요. 한 번만 해요.',game:'rps',options:[['rock','주먹을 낸다.',''],['paper','보를 낸다.',''],['scissors','가위를 낸다.','']],second:[['honor','승패를 받아들이고 테이블을 함께 정리한다.','같이 하면 내기한 의미가 없는데요. 그래도 저는 이쪽 치울게요.','작은 승부 뒤 테이블의 각자 물건을 정리했다. 승패로 호감도를 더 주지 않고 서연의 의외로 진지한 면을 보았다.'],['rematch','다음에 한 번 더 하자고 하고 오늘은 여기서 마친다.','기억해둘게요. 다음에 제가 먼저 얘기해도 모른 척하기 없어요.','즉시 재대결을 강요하지 않고 다음의 작은 장난거리로 남겼다. 실제 약속 시각을 자동으로 잡지는 않았다.']],callback:'가위바위보 한 번 더 하자고 한 거, 그냥 한 말은 아니었죠?'},
 'seoyeon:3':{person:'seoyeon',episode:3,previous:'seoyeon:2',title:'말하지 않아도 아는 사이?',places:['hall','library','cafe','cafeteria'],intro:'서연은 평소처럼 웃다가 휴대폰을 잠시 뒤집어 둔다. 태이가 눈치를 살피자 먼저 고개를 젓는다. “무슨 생각인지 맞히려고 하진 말고요.”',opening:'눈치가 빠른 건 좋은데, 제가 말하기 전에 결론까지 나 있으면 조금 서운할 때도 있어요.',options:[['ask','내가 짐작한 건 잠시 접고 지금 원하는 걸 직접 묻는다.','오늘은 그냥 잠깐 조용히 있고 싶었어요. 기분 나쁜 건 아니고요. 이렇게 물어보면 대답할 수 있잖아요.'],['admit','눈치를 보다가 너무 빨리 단정할 때가 있다고 인정한다.','저도 괜찮다고 먼저 말해버릴 때가 있으니까요. 둘 다 말 안 해도 통한다고 생각하면 더 헷갈리겠네요.'],['assume','표정만 봐도 알 것 같다고 다시 확신한다.','제가 아니라고 말할 자리도 남겨주면 좋겠어요. 알아주는 것하고 정해 주는 건 다르니까.']],second:[['signal','혼자 있고 싶을 때와 같이 있고 싶을 때 편하게 말하기로 한다.','대단한 암호 같은 건 말고요. 오늘은 조용히 있고 싶다, 그 정도면 충분해요.','서로의 마음을 읽는 대신 간단한 말로 확인하기로 했다. 태이의 빠른 눈치가 늘 정답은 아니라는 여지를 남겼다.'],['space','지금은 조용히 쉬고, 나도 필요한 게 있으면 말하겠다고 한다.','좋아요. 오늘은 이대로 조금만 쉬어요. 뭘 계속 해줘야 하는 건 아니니까.','침묵을 불만이나 거절로 단정하지 않고 잠깐 함께 쉬었다. 각자의 편안한 거리를 확인했다.']],callback:'지난번에 말한 것처럼요. 오늘은 제가 먼저 필요한 걸 얘기해 볼게요.'},
 'soyul:2':{person:'soyul',episode:2,previous:'soyul',title:'렌즈 밖으로 한 걸음',places:['library','hall','cafe'],intro:'창가의 빛을 보던 소율이 휴대폰을 들었다가 내린다. “혹시 여기 잠깐 서 있어 주실 수 있어요?” 부탁한 뒤에야 시선을 마주친다.',opening:'모델처럼 해달라는 건 아니고요. 사람이 있으면 구도가 어떻게 달라지는지 보고 싶어서.',options:[['natural','편한 자세로 서고 어느 쪽을 보면 되는지 묻는다.','그냥 창밖 봐주시면… 네, 그렇게요. 아, 너무 가만히 계실 필요는 없어요.'],['pose','일부러 과장된 포즈를 취하고 가볍게 웃는다.','아니, 그런 거 말고… 잠깐, 지금 건 좀 웃긴데. 그 표정 한 번만 더요.'],['frame','얼굴이 나오지 않는 뒷모습이나 손부터 찍어보자고 한다.','그것도 좋아요. 얼굴이 꼭 보여야 사람의 느낌이 나는 건 아니니까.']],second:[['review','찍힌 사진을 함께 보고 남길 범위를 서로 확인한다.','태이 씨가 불편한 건 지울게요. 찍게 해줬다고 다 괜찮다는 뜻은 아닐 테니까.','촬영과 보관의 범위를 함께 확인했다. 동의하지 않은 사진을 임의로 저장·전송하지 않았다.'],['delete','연습한 구도만 기억하고 사진은 지금 지우자고 한다.','알겠어요. 그래도 찍는 동안 어떤 느낌인지는 봤으니까요. 도와줘서 고마워요.','구도를 연습한 뒤 촬영 파일은 지운 것으로 정리했다. 삭제 선택 때문에 관계를 자동으로 나쁘게 만들지 않았다.']],callback:'지난번에 서 계셨던 구도, 사람 없이 다시 보니까 느낌이 진짜 다르더라고요.'},
 'soyul:3':{person:'soyul',episode:3,previous:'soyul:2',title:'지우지 않은 한 줄',places:['library','cafe','hall'],intro:'소율이 사진 아래 적어 둔 짧은 글을 보여준다. 보여주기 직전까지도 마지막 단어를 고치다가, 이번에는 화면을 끄지 않는다.',opening:'사진 설명은 아닌데… 적어놓고 보니까 그냥 제 얘기 같아서요. 어색해도 끝까지 한 번 읽어주실래요?',options:[['read','평가부터 하지 않고 끝까지 읽은 다음 어떤 반응을 원하는지 묻는다.','잘 썼다는 말보다, 무슨 말인지 전해졌는지가 궁금했어요. 제가 너무 혼자만 아는 얘기를 쓴 건가 해서.'],['share','나도 다듬다 만 문장을 꺼내 서로 읽어본다.','이건 아직 안 끝낸 거예요? 저도 완성 안 된 걸 보여드린 거니까… 그럼 좀 덜 민망하네요.'],['fix','읽는 도중 어색한 표현부터 바로 고쳐준다.','고칠 곳이 있다는 건 아는데, 먼저 끝까지 읽어주셨으면 했어요. 그다음에 물어보려고요.']],second:[['interpret','내가 읽은 뜻을 말하고 본인이 쓰려던 뜻과 비교해본다.','다르게 읽힐 수도 있네요. 그게 꼭 틀린 건 아닌데, 제가 더 남기고 싶은 부분은 알 것 같아요.','태이의 해석을 정답으로 두지 않고 소율이 남기고 싶은 뜻을 확인했다. 수정 여부는 소율이 결정했다.'],['unfinished','미완성으로 남겨도 된다며 오늘은 여기까지만 읽는다.','그럼 오늘은 안 지울게요. 나중에 다시 보면 지금보다 덜 어색할지도 모르니까.','글을 서둘러 공개하거나 완성시키지 않았다. 소율이 자기 문장을 남겨 두기로 한 선택을 함께 기억했다.']],callback:'그때 읽어드린 글, 아직 남겨뒀어요. 마지막 단어는 또 바뀌었지만요.'},
 'iseo:2':{person:'iseo',episode:2,previous:'iseo',title:'승부는 한 번만',places:['gym','field','outdoorCourt'],intro:'운동을 마친 이서가 바닥의 선 옆에 선다. 이번에는 무작정 기록부터 재지 않고 태이 쪽을 보며 웃는다.',opening:'한 발로 균형 잡기 어때요? 무리하기 없기. 넘어질 것 같으면 그냥 내려놓는 걸로요.',game:'balance',options:[['steady','호흡을 맞추고 안정적으로 버틴다.','기록도 안 쟀는데 왜 이렇게 진지해요? 아, 저도 말하다가 흔들렸네.'],['rhythm','숫자 대신 짧은 리듬을 맞추며 버틴다.','이러면 운동보다 합주 같은데요. 근데 리듬 맞추니까 덜 긴장돼요.'],['playful','무리하지 않는 선에서 서로 웃음을 참아본다.','저 웃기면 안 되죠. 아니, 제가 먼저 웃었나? 잠깐만 다시… 아, 한 번만 하기로 했지.']],second:[['finish','결과보다 자세를 정리하고 약속한 한 번에서 끝낸다.','끝내자고 먼저 말해주니까 좋네요. 저 혼자였으면 한 번 더 했을 것 같아서.','짧은 균형 놀이 후 발목을 풀고 마쳤다. 이기기 위해 몸을 무리하게 쓰는 선택이나 돈 내기는 하지 않았다.'],['laugh','잘 버틴 쪽을 인정하고 가볍게 장난치며 마친다.','인정은 해요. 근데 오늘 진 걸로 다음에도 무조건 질 거라고 생각하면 안 돼요.','서로의 움직임을 보며 웃고 승부는 그 자리에서 마쳤다. 승패 자체로 추가 호감 보상을 주지 않았다.']],callback:'한 번만 하고 끝내자고 했던 거요. 혼자 운동할 때도 한번 써봤어요.'},
 'iseo:3':{person:'iseo',episode:3,previous:'iseo:2',title:'오늘은 듣는 쪽',places:['gym','field','outdoorCourt'],intro:'이서는 하려던 말을 멈추고 태이에게 먼저 물병을 챙길 시간을 준다. “맨날 제 운동 얘기만 했네요.” 이번에는 대답을 기다린다.',opening:'오늘은 제가 들어볼게요. 운동 말고 요즘 제일 많이 생각하는 거, 뭐예요?',options:[['music','음악을 통해 내 이야기를 남기고 싶은 마음을 말한다.','노래를 잘하고 싶다는 거랑은 조금 다른 얘기네요. 그러면 듣는 사람한테 뭘 제일 남기고 싶어요?'],['home','목포에 있는 가족과 혼자 사는 생활 이야기를 조금 나눈다.','멀리 있으면 별일 없어도 문득 생각날 때 있죠. 지금 다 얘기 안 해도 돼요. 그냥 들어볼게요.'],['ask','이서는 남의 이야기를 들을 때 어떤지 가볍게 되묻는다.','저 말만 많이 하는 사람은 아니거든요? 아, 지금도 제가 말했네. 그래도 이번엔 진짜 기다릴 수 있어요.']],second:[['thanks','들어줘서 고맙다고 하고, 다음에는 이서의 다른 이야기도 듣기로 한다.','좋아요. 다음에 제가 또 운동 얘기부터 하면 다른 얘기도 하라고 말해줘요.','태이가 말하고 이서가 듣는 시간을 가졌다. 말이 많은 모습 외에 기다려 줄 줄 아는 면을 알게 됐다.'],['exchange','다 말할 필요 없이 서로 편한 만큼 나누자고 한다.','그게 좋겠네요. 가까워지려면 무조건 다 알아야 하는 건 아닐 테니까요.','큰 고백을 강요하지 않고 서로 말할 범위를 정했다. 가까움과 사적인 영역을 함께 남겨 두었다.']],callback:'지난번 얘기, 운동하다가도 문득 생각났어요. 오늘은 어디까지 이야기해볼까요?'},
 'iseo:4':{person:'iseo',episode:4,previous:'iseo:3',title:'공을 기다리는 자세',places:['gym'],intro:'네트를 친 코트 한쪽에서 이서가 배구공을 꺼낸다. 후드집업과 가방을 벤치에 놓고, 안에 입던 운동용 상의 차림으로 어깨와 발목을 푼다.',opening:'오늘은 리시브만 조금 해보려고요. 세게 말고, 이쪽으로 가볍게 던져주실래요?',options:[['feed','빈 코트를 확인하고, 이서가 준비됐다고 하면 공을 가볍게 보낸다.','네, 지금이요! 아, 팔로 막 치는 게 아니라 공 밑으로 먼저 가야 되는데. 한 번만 천천히 다시 해볼게요.'],['watch','먼저 자세를 보여달라고 하고 공을 가볍게 보내준다.','무릎을 조금 굽히고요. 팔은 이렇게 모아요. 말로 설명하니까 제가 더 헷갈리네. 일단 한 번 받아볼게요.']],second:[['finish','약속한 연습을 마치고 공을 반납한 뒤 함께 정리 운동을 한다.','딱 이만큼 하니까 좋네요. 오늘은 진짜 더 안 할 거예요. 물부터 마실래요.','이서와 가볍게 공을 주고받으며 리시브 자세를 확인했다. 공을 반납하고 후드집업과 가방을 챙긴 뒤 연습을 마쳤다.'],['talk','공을 정리하며 이서가 연습에서 재미있었던 부분을 묻는다.','딱 맞게 받아서 공이 뜰 때요. 별거 아닌데 기분 좋거든요. 오늘은 그거 한 번 했으니까 됐어요.','짧은 리시브 연습 뒤 즐거웠던 순간을 이야기했다. 추가 연습을 강요하지 않고 정리 운동과 물 마시기로 마쳤다.']],callback:'저번에 공 던져주신 거요. 덕분에 혼자 벽 보고 할 때보다 재밌었어요.'}
};
function followupGameOutcome(def,choice,roll){
 if(def.game==='rps'){const hands=['rock','paper','scissors'],i=hands.indexOf(choice);if(i<0)return null;const result=i===roll?'tie':(i-roll+3)%3===1?'win':'lose';return {result,npcHand:hands[roll],text:result==='tie'?'둘 다 같은 손을 내고 잠깐 멈춘다. 서연이 먼저 웃는다. “이러면 정리도 같이 하는 거죠?”':result==='win'?'서연이 자기 손을 내려다보더니 입술을 한번 다문다. “졌네요. 알겠어요. 다음에는 안 봐줄 거예요.”':'서연은 조용히 손을 거두고 웃는다. “저 이런 건 꽤 진지하게 해요. 테이블은 같이 치워도 되고요.”'};}
 if(def.game==='balance'&&choice!=='introduce')return {result:['taei','iseo','both'][roll],text:['이서가 먼저 발을 내려놓고 웃는다. “오늘은 인정할게요. 대신 무리해서 버티지는 말기요.”','태이가 먼저 발을 내리자 이서가 반갑게 웃는다. “저도 잘하는 거 있거든요. 다음에도 그냥 이기게 해주진 마세요.”','둘이 거의 동시에 발을 내리고 마주 웃는다. 기록보다 웃음을 참는 쪽이 어려웠다.'][roll]};
 return null;
}

 yeogyeong:{title:'맞지 않는 1,200원',places:['hall','library','cafe','cafeteria'],intro:'옆에서 문이 쾅 닫히자 여경의 눈이 크게 뜨이고 입술이 굳는다. 놀란 기색을 숨기지 못한 채 잠깐 숨을 고른 뒤, 수첩과 영수증으로 시선을 돌린다. 같은 줄을 두 번 확인하고도 종이를 덮지 못한다.',opening:'큰돈은 아닌데요. 안 맞는 걸 그냥 넘기는 건 좀 그래서요. 제가 어디서 빼먹었나.',options:[['compare','어디까지 확인했는지 묻고, 허락받은 영수증만 대조한다.'],['break','잠깐 쉬었다가 본인이 확인하고 싶은 부분부터 같이 보자고 한다.'],['pay','내가 1,200원을 내면 해결되지 않겠느냐고 묻는다.']],second:[['share','다음에도 혼자 확인하지 않도록 대조 방법을 함께 적는다.'],['respect','지금 정리한 부분까지만 넘기고 남은 확인은 본인이 맡게 둔다.']]},

 soyul:{title:'아직 보여주지 않은 한 장',places:['library','hall','cafe'],intro:'소율이 휴대폰 화면을 껐다 켠다. 사진을 고르는 손은 멈췄는데, 설명을 꺼내는 쪽이 더 어려워 보인다.',opening:'이 사진은… 잘 찍었다는 말 말고요. 무슨 느낌인지 한번 들어보고 싶어서. 근데 그냥 안 봐도 돼요.',options:[['permission','보여 주고 싶은 사진만 편한 만큼 보여 달라고 한다.'],['listen','사진 설명보다, 왜 남겨 두고 싶은지 먼저 물어본다.'],['choose','사진을 보기 전에 어떤 사진을 골라야 할지 먼저 정해 준다.']],second:[['meaning','내가 느낀 점을 말하되, 해석이 맞는지는 본인에게 묻는다.'],['wait','바로 공개하지 않아도 된다며 저장해 둘 시간을 준다.']]},

function iseoEventLocation(s){if(s.clock.minute<960||s.clock.minute>=1080)return null;return wetWeather(s)?'gym':s.clock.minute<1020?'gym':s.day%2?'field':'outdoorCourt';}
function enoughTime(s,id,minutes){if(s.clock.minute+minutes>1320)return false;if(id==='taei')return true;const booked=(s.appointments??[]).some(a=>a.person===id&&a.day===s.day&&a.status==='pending'&&a.minute>=s.clock.minute&&a.minute<s.clock.minute+minutes);return !booked&&(id==='iseo'||!timetable(s,id).some(c=>c.start<s.clock.minute+minutes&&c.end>s.clock.minute));}
function firstPersonalEventsAt(s,place=s.location){
 if(s.academics?.registrationPending||s.freeDay?.home)return [];
 return Object.entries(personalEventDefs).filter(([id,d])=>{
  const r=s.personalEvents?.records?.[id];if(r?.status==='completed'||s.clock.minute<720||!enoughTime(s,id,r?.stage?20:30)||!d.places.includes(place))return false;
  if(id==='taei')return s.clock.minute>=780;
  if(id==='iseo')return (personalEventPosition(s,id)??iseoEventLocation(s))===place;
  if(!contact(s,id).introduced||s.clock.minute>=1080)return false;const bond=relationship(s,id);if(bond.familiarity<3||bond.trust<2||bond.tension>=4)return false;
  return (personalEventPosition(s,id)===place||presentPeople(s,place).includes(id))&&!npcNow(s,id).rushed;
 }).map(([person,d])=>({person,eventId:person,title:person==='iseo'&&!contact(s,'iseo').introduced?'운동을 마친 학생':d.title,resuming:s.personalEvents?.records?.[person]?.status==='paused'}));
}
function personalEventRecord(s){return s.personalEvents?.records?.[s.personalEvents?.active]??null;}

function opportunityCandidates(s){

 const lesson=nextLesson(s);if(lesson&&lesson.start>=s.clock.minute&&lesson.start-s.clock.minute<45)return [];

 for(const [id,d] of Object.entries(communityActivityDefinitions)){
  if(!onsite.has(id)&&!s.flow?.postsRead?.[id])continue;

 }
 return out;
}
function currentOpportunity(s){const h=s.opportunityHints?.active;return h&&opportunityCandidates(s).some(c=>c.id===h.id)?h:null;}
function updateOpportunityHints(s){
 const log=s.opportunityHints??={seen:[],day:s.day,count:0,last:-999,active:null};
 if(log.day!==s.day){log.day=s.day;log.count=0;log.last=-999;log.active=null;}
 if(log.active&&!currentOpportunity(s))log.active=null;
 if(log.active||log.count>=2||s.clock.minute-log.last<90)return;
 const candidates=opportunityCandidates(s).filter(c=>!log.seen.includes(c.id));
 if(!candidates.length)return;
 const h=candidates[(s.day+Math.floor(s.clock.minute/30))%candidates.length];
 log.active=h;log.seen.push(h.id);log.count++;log.last=s.clock.minute;
}

function progressFortnightActivity(state,id){const view=fortnightActivityView(state);if(!view)throw new Error('오늘 이 장소에서 이어갈 활동이 없습니다.');const choice=view.step===0?view.choices.find(c=>c[0]===id):view.choices.find(c=>c[0]===view.choice);if(!choice||view.step===1&&id!=='finish')throw new Error('현재 단계의 행동을 확인해 주세요.');let s=advanceFreeTime(state,15);s.fortnightLife??={};if(view.step===0){s.fortnightLife[s.day]={step:1,choice:id,done:false};s.lastResult=choice[2]+' 남은 메모와 주변 자리를 정리하자.';}else{s.fortnightLife[s.day]={step:2,choice:view.choice,done:true};s.memory.push(`[${s.day}일차] ${view.title}: ${choice[2]}`);s.freeDay??={completed:[],settled:false};s.freeDay.completed.push({id:view.title,start:s.clock.minute-30,end:s.clock.minute});s.known.push(...(s.known.includes(view.title+' 기록')?[]:[view.title+' 기록']));s.lastResult=choice[2]+' 사용한 자리를 정리하고 하던 일로 돌아간다.';}s.pace={count:0,seen:{}};return s;}

function advanceIseoPreview(s,choice){
 const view=iseoPreviewView(s);
 if(choice==='next'){if(s.beat>=view.lines.length-1)throw new Error('더 읽을 문장이 없습니다.');return {...s,beat:s.beat+1};}

}

function varyEverydayAction(state,{action,text,minute=state.clock.minute,returnScreen='place'}){
 const s=structuredClone(state),life=everydayStore(s),key=`${s.day}:${minute}:${s.location}:${action}`;
 const old=life.history.findLast(r=>r.key===key);if(old)return {state:s,text:old.text,repeated:true};
 const visits=life.history.filter(r=>r.location===s.location&&r.action===action),details=actionDetails[action]??['하던 일을 마친 뒤 다음 사람이 사용할 공간을 정리한다.','주변의 움직임을 보며 방해되지 않게 자리를 고쳐 잡는다.','이번에는 서두르지 않고 앞에서 놓친 부분을 한 번 더 확인한다.'];
 const previous=visits.at(-1)?.detail;const options=details.filter(d=>d!==previous);const detail=options[Math.floor(everydayRoll(s)*options.length)];
 const atmosphere=wetWeather(s)?'창밖과 출입구 쪽에서 빗소리가 이어진다.':s.clock.minute<720?'오전의 소음이 멀어지고 자기 손이 움직이는 소리가 또렷해진다.':s.clock.minute>=1080?'사람들이 하나둘 짐을 챙기는 사이 남은 일을 이어간다.':'주변 사람들도 각자의 일에 집중하거나 자리를 옮긴다.';
 const combined=(visits.length?`같은 활동이라도 이번에는 ${detail}`:text+' '+detail)+' '+atmosphere;
 const record={key,day:s.day,minute,location:s.location,action,text:combined,detail};life.history.push(record);life.sequence++;
 const recent=life.history.filter(h=>h.eventId&&h.day===s.day&&Math.abs(s.clock.minute-(h.eventMinute??h.minute))<60);
 const pool=everydayEvents.filter(e=>(!e.after||life.history.some(h=>h.eventId===e.after.id&&h.eventOutcome===e.after.choice&&h.day<s.day&&h.location===s.location))&&(!e.once||!life.history.some(h=>h.eventId===e.id))&&e.places.includes(s.location)&&(!e.wet||wetWeather(s))&&!life.history.slice(-5).some(h=>h.eventId===e.id));
 const due=pool.filter(e=>e.after);
 if(!life.pending&&!recent.length&&pool.length&&(due.length||everydayRoll(s)<.38)){
  const event=due.length?due[0]:pool[Math.floor(everydayRoll(s)*pool.length)];record.eventId=event.id;record.eventMinute=s.clock.minute;life.pending={key:'everyday:'+life.sequence,id:event.id,day:s.day,minute:s.clock.minute,location:s.location,text:event.text,choices:event.choices.map(([id,label])=>({id,label})),returnScreen,recordKey:key};
 }
 s.memory.push(`[${s.day}일차] ${combined}`);return {state:s,text:combined,repeated:false};
}
function everydayEventView(s){const e=s.everydayLife?.pending;return e&&e.day===s.day&&e.location===s.location?structuredClone(e):null;}
function resolveEverydayEvent(state,choice){
 const event=everydayEventView(state),def=everydayEvents.find(e=>e.id===event?.id),selected=def?.choices.find(c=>c[0]===choice);if(!event||!selected)throw new Error('이미 지나간 상황입니다.');
 const s=structuredClone(state),record=s.everydayLife.history.find(r=>r.key===event.recordKey);record.eventOutcome=choice;record.eventText=selected[2];s.everydayLife.pending=null;s.memory.push(`[${s.day}일차] ${selected[2]}`);return {state:s,text:selected[2],returnScreen:event.returnScreen};
}
function abandonEverydayEvent(state){if(!state.everydayLife?.pending)return state;const s=structuredClone(state),e=s.everydayLife.pending,r=s.everydayLife.history.find(h=>h.key===e.recordKey);if(r)r.eventOutcome='left';s.everydayLife.pending=null;return s;}

 requireCafe(state);const draft=state.cafeLife?.draft,drink=cafeMenu.find(d=>d.id===draft?.drink);if(!drink||!draft.temperature)throw new Error('음료와 온도를 골라 주세요.');

function splitNovelText(text,limit=180){
 if(!Number.isInteger(limit)||limit<1)throw new Error('올바른 문장 길이를 지정해야 합니다.');
 let remaining=String(text??'').replace(/\s+/g,' ').trim();const parts=[];
 while(remaining.length>limit){
  const window=remaining.slice(0,limit);let cut=-1;
  for(const match of window.matchAll(/[.!?。](?:[”’"']?)(?=\s)/g))cut=match.index+match[0].length;
  if(cut<Math.floor(limit/3))cut=window.lastIndexOf(' ');
  if(cut<=0)cut=limit;
  parts.push(remaining.slice(0,cut).trim());remaining=remaining.slice(cut).trim();
 }
 if(remaining)parts.push(remaining);return parts;
}

function campusMinute(s){return s.clock?.minute??(s.phase==='evening'?1140:780);}

function timeCost(s,action,destination){

}
function canSpendTime(s,minutes){if(s.playMode==='free')return campusMinute(s)+minutes<=1320;return s.day!==1||s.phase!=='afternoon'||campusMinute(s)+minutes<=960;}

function spendTime(state,minutes,{travelling=false}={}){

function paceAction(before,after,{action,value,from,to,person}={}){

 if(action==='wait'){
  const minutes=Math.min(30,Math.max(0,(s.playMode==='free'?1320:960)-campusMinute(s)));
  s=s.playMode==='free'?advanceFreeTime(s,minutes):spendTime(s,minutes);s.pace={count:0,seen:{}};return {state:s,minutes};
 }
 if(campusMinute(s)>=(s.playMode==='free'?1320:960))return {state:s,minutes:0};
 const stamp=campusMinute(s);let key=null;
 if(action==='classTravel'&&before.location!==s.location)key=`${stamp}:classTravel:${s.location}`;
 if(action==='visit'&&before.location!==s.location)key=`${stamp}:visit:${before.location}:${s.location}`;
 if(action==='buildingArea')key=`${stamp}:area:${before.location}:${value}`;
 if(action==='buildingActivity')key=`${stamp}:building:${s.location}:${value}`;
 if(action==='libraryActivity')key=`${stamp}:library:${value}`;
 if(action==='walk')key=`${stamp}:walk:${s.location}:${value}`;
 const leavingConversation=['dialogue','group'].includes(from)&&['place','campus','activities','travel','result'].includes(to);
 if(leavingConversation)key=`${stamp}:conversation:${person??'group'}`;
 if(key&&!s.pace.seen[key]){s.pace.seen[key]=true;s.pace.count++;if(['visit','classTravel'].includes(action)){s.pace.outdoor=true;s.pace.blockMinutes=Math.max(s.pace.blockMinutes??30,weatherBlockMinutes(s,true));}}

 if(s.pace.count<3||!safe)return {state:s,minutes:0};
 const minutes=Math.min(s.pace.blockMinutes??30,(s.playMode==='free'?1320:960)-campusMinute(s));
 s=s.playMode==='free'?advanceFreeTime(s,minutes,{travelling:['visit','classTravel'].includes(action)}):spendTime(s,minutes,{travelling:['visit','classTravel'].includes(action)});s.pace={count:0,seen:{}};
 return {state:s,minutes};
}

function travelPage(){
 const hints={field:'트랙 · 그늘 벤치',outdoorCourt:'야외 코트 · 가벼운 연습',gym:'실내 코트 · 체력단련실',arts:'강의실 · 합주실 · 무대',music:'중형 연습실',headquarters:'강의실 · 은행 · 편의점',creative:'실습실 · 도서관',academic:'교양 강의실',sculpture:'강의실 · 실습실',baekseok:'채플 · 대형 좌석 공간',cafeteria:'학식당 · 카페 · 조리실',hall:'동아리실 · 공용 회의실',library:'책 · 열람 좌석 · 자료실',cafe:'음료 · 휴식 · 개인 작업',dorm:'현관 안내 · 바깥 쉼터'};
 return `<div class="travel-intro"><p><strong>지도에서 목적지를 눌러 이동하세요.</strong><br>건물 안의 층·호실은 도착한 뒤 고를 수 있어요.</p><span class="travel-current">현재 · ${esc(locations[state.location]??'캠퍼스')}</span></div><label class="travel-search">${utilityIcon('travel')}<input type="search" id="travel-search" aria-label="장소 검색" placeholder="건물 이름이나 시설 검색" value="${esc(travelQuery)}" autocomplete="off"></label><nav class="travel-tabs" aria-label="장소 분류">${[['all','전체'],['outdoor','야외'],['study','강의 · 연습'],['life','생활 · 모임']].map(([id,label])=>`<button data-action="travelFilter" data-value="${id}" aria-pressed="${travelFilter===id}">${label}</button>`).join('')}</nav><div class="map-key"><span>● 현재 위치</span><span>건물을 누르면 이동</span><span>! 지금 참여할 수 있는 이벤트</span><small>게임용 배치도 · 실제 지리와 다를 수 있어요</small></div><span class="travel-count" role="status" aria-live="polite"></span><div class="campus-map-scroll" tabindex="0" aria-label="캠퍼스 지도. 좁은 화면에서는 좌우로 움직여 모든 건물을 볼 수 있습니다."><div class="campus-map regional-map" data-region="${travelRegion}" aria-label="클릭해서 이동하는 캠퍼스 배치도"><div class="regional-map-art" data-art-set="${mapRegions[travelRegion].artSet??'campus'}" data-atlas="${mapRegions[travelRegion].atlas}" aria-hidden="true"></div><div class="region-heading"><span>지역 지도</span><strong>${esc(mapRegions[travelRegion].name)}</strong><small>화살표: 옆 지도 보기 · 이름표: 실제 이동</small></div>${state.location==='campus'&&travelRegion==='north'?'<span class="region-player">● 현재 위치 · 중앙 계단길</span>':''}${Object.entries(mapRegions[travelRegion].links).map(([direction,target])=>`<button class="region-arrow region-${direction}" data-action="mapRegion" data-value="${target}" aria-label="${mapRegions[target].name} 지도 보기"><span>${{north:'↑',south:'↓',east:'→',west:'←'}[direction]}</span>${mapRegions[target].name}</button>`).join('')}<button class="region-current" data-action="mapCurrent">◎ 내 위치 지도</button>${Object.entries(locations).map(([id,label],index)=>{const pos=campusMapPositions[id]??[index%4+1,Math.floor(index/4)+1],site=minimapSites[id],regionSite=regionSites[id],events=mapEventsAt(state,id);return `<button class="travel-card map-building" style="grid-column:${pos[0]};grid-row:${pos[1]};--map-x:${regionSite[1]}%;--map-y:${regionSite[2]}%;--map-w:12%;--map-h:9%" data-region="${regionSite[0]}" data-category="${travelCategory(id)}" aria-label="${label} 찾아가기${events.length?' · 참여 가능한 이벤트 '+events.length+'개':''}" data-action="visit" data-value="${id}" ${id===state.location?'aria-current="location"':''} ${!canSpendTime(state,timeCost(state,'visit',id))?'disabled':''}>${events.length?`<span class="map-event-marker" aria-hidden="true">!</span>`:'<span class="region-pin" aria-hidden="true">◇</span>'}<strong>${esc(label)}</strong><small>${esc(hints[id]??surroundingPlaces[id]?.summary??({'market':'식음료 · 생활용품','restaurant':'식사 · 쉬어가기','pub':'저녁 식사 · 모임'}[id]??'캠퍼스 공간'))}</small>${id===state.location?'<span class="map-you">● 여기</span>':''}<span class="map-move">${id===state.location?'주변 보기':'이동 →'}</span></button>`;}).join('')}</div></div><p class="map-scroll-hint">↔ 좁은 화면에서는 지도를 좌우로 밀어보세요.</p><p class="travel-empty" hidden>조건에 맞는 장소가 없어요. 검색어나 분류를 바꿔보세요.</p>`;
}
function applyTravelFilter(){
 const cards=[...app.querySelectorAll('.travel-card')],query=travelQuery.trim().toLocaleLowerCase();let visible=0;
 for(const card of cards){card.hidden=card.dataset.region!==travelRegion||!(travelFilter==='all'||card.dataset.category===travelFilter)||!card.textContent.toLocaleLowerCase().includes(query);if(!card.hidden)visible++;}
 for(const button of app.querySelectorAll('[data-action="travelFilter"]'))button.setAttribute('aria-pressed',String(button.dataset.value===travelFilter));
 const count=app.querySelector('.travel-count');if(count)count.textContent=visible+'개 장소';const empty=app.querySelector('.travel-empty');if(empty)empty.hidden=visible!==0;
}
app.addEventListener('pointerover',e=>{const cell=e.target.closest('.tactic-cell');if(!cell||combatAnimating)return;const board=cell.closest('.tactical-board');for(const n of board.querySelectorAll('.cell-route'))n.classList.remove('cell-route');if(combatMode!=='move'||!cell.classList.contains('cell-reachable'))return;for(const value of cell.dataset.route.split(';'))board.querySelector(`[data-action="combatTile"][data-value="${value}"]`)?.classList.add('cell-route');const hint=app.querySelector('.tactical-map-hint');if(hint)hint.textContent=`이동 경로 ${cell.dataset.route.split(';').length}칸 · 스태미나 ${cell.dataset.cost} · 클릭하면 이동`;});

app.addEventListener('input',e=>{if(e.target.id==='travel-search'){travelQuery=e.target.value;const match=[...app.querySelectorAll('.travel-card')].find(n=>n.textContent.toLocaleLowerCase().includes(travelQuery.trim().toLocaleLowerCase()));if(travelQuery.trim()&&match&&match.dataset.region!==travelRegion){const focus=e.target.selectionStart;travelRegion=match.dataset.region;render();const input=app.querySelector('#travel-search');input.focus();input.setSelectionRange(focus,focus);}else applyTravelFilter();}});

document.addEventListener('keydown',e=>{if(screen!=='iseoDialogue'||e.code!=='Space'||e.target.closest('button,input,textarea,select'))return;const v=iseoPreviewView(iseoAudition);if(iseoAudition.beat<v.lines.length-1){e.preventDefault();iseoAudition=advanceIseoPreview(iseoAudition,'next');render();}});

document.addEventListener('keydown',e=>{if(screen==='opening'&&e.code==='Space'&&!e.target.closest('button,input,textarea,select')){e.preventDefault();state=progressReturningOpening(state);screen=initialReturningScreen(state);render();}});

window.addEventListener('resize',()=>requestAnimationFrame(fitCharacterStage));
</script></body></html>
