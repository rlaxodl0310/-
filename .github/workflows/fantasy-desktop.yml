name: Fantasy desktop Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasy-desktop.yml'
      - 'fantasy-rpg/desktop/**'
permissions:
  contents: write
concurrency:
  group: fantasy-desktop-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fantasy-rpg/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fantasy-rpg/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/prepare-codex.cjs
      - run: npm test
      - run: npm run package:win
      - name: Build and test patch program
        shell: pwsh
        run: ./scripts/build-patch.ps1
      - name: Package downloadable ZIP
        shell: pwsh
        run: |
          Copy-Item ui/sample.lookpack release/FantasyStory-Lookpack-Sample.lookpack
          Copy-Item README.md release/FantasyStory-win32-x64/README.txt
          Copy-Item licenses/Codex-APACHE-2.0.txt release/FantasyStory-win32-x64/CODEX-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/FantasyStory-win32-x64/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release/FantasyStory-win32-x64 -DestinationPath release/FantasyStory-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: FantasyStory-Windows-x64
          path: |
            fantasy-rpg/desktop/release/FantasyStory-Windows-x64.zip
            fantasy-rpg/desktop/release/FantasyStory-Patch.zip
            fantasy-rpg/desktop/release/FantasyStory-Lookpack-Sample.lookpack
          compression-level: 0
          retention-days: 14
      - name: Attach to owner-only draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version-preview"
          gh release view $tag --repo rlaxodl0310/- *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title "이세계 기록 v$version" --notes "Windows 앱과 패치를 준비하는 중입니다." --repo rlaxodl0310/-
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          gh release upload $tag release/FantasyStory-Windows-x64.zip release/FantasyStory-Patch.zip release/FantasyStory-Lookpack-Sample.lookpack --clobber --repo rlaxodl0310/-
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          $hash = (Get-FileHash release/FantasyStory-Patch.zip -Algorithm SHA256).Hash
          @"
          v0.18.1: 캐릭터별 기본 자세 SD 적용. 차여경·한유이·윤서하·정우진·임소윤·네아의 원화 임시 표시를 고유 자세 SD로 교체하고 제로 SD를 추가했습니다.
          캐릭터별 중심 이동·회피·방어 연출을 구분했습니다. 무기·포지션은 확정하지 않습니다. 새 여섯 인물의 관절별 걷기·장비별 공격 프레임은 아직 완성 단계가 아닙니다.
          이야기 화면에서 얼굴을 별도로 붙이던 합성을 제거했습니다. 컷신 확대·AI 대화 이어가기 수정은 이번 패치에 포함하지 않았습니다.
          기존 앱 사용자는 FantasyStory-Patch.zip을 폴더 전체로 압축 해제하고 FantasyStoryPatch.exe를 실행하세요. 게임은 저장 후 종료해주세요. 로그인과 저장은 유지합니다.
          신규 설치는 FantasyStory-Windows-x64.zip입니다. 직접 실행하는 패치이며 온라인 자동 업데이트는 아닙니다.
          Patch SHA256: $hash
          소유자만 확인하는 초안 릴리스입니다. GitHub 소유자 계정 로그인이 필요합니다.
          "@ | Set-Content release/notes.txt -Encoding utf8
          gh release edit $tag --notes-file release/notes.txt --repo rlaxodl0310/-
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
