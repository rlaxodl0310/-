name: Fantasy desktop Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasy-desktop.yml'
      - 'fantasy-rpg/desktop/**'
permissions:
  contents: write
concurrency:
  group: fantasy-desktop-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fantasy-rpg/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fantasy-rpg/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/prepare-codex.cjs
      - run: npm test
      - run: npm run package:win
      - name: Package downloadable ZIP
        shell: pwsh
        run: |
          Copy-Item README.md release/FantasyStory-win32-x64/README.txt
          Copy-Item licenses/Codex-APACHE-2.0.txt release/FantasyStory-win32-x64/CODEX-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/FantasyStory-win32-x64/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release/FantasyStory-win32-x64 -DestinationPath release/FantasyStory-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release/FantasyStory-Windows-x64.zip -Algorithm SHA256).Hash
          @"
          Windows x64 Electron 앱 시제품입니다. Assets의 ZIP을 받아 폴더 전체를 압축 해제한 뒤 FantasyStory.exe를 실행하세요.
          상단 ChatGPT 연결에서 공식 계정으로 로그인합니다. 구독의 Codex 사용 한도가 적용됩니다.
          Windows CI에서 자동 검사를 수행했습니다. 실제 사용자 계정 로그인과 모델 응답은 별도 검증이 필요하며 코드서명 전 시제품입니다.
          SHA256: $hash
          이 릴리스는 초안입니다. 저장소 소유자의 GitHub 계정으로 로그인해야 볼 수 있습니다.
          "@ | Set-Content release/notes.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: FantasyStory-Windows-x64
          path: fantasy-rpg/desktop/release/FantasyStory-Windows-x64.zip
          compression-level: 0
          retention-days: 14
      - name: Attach to owner-only draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v0.1.0-preview release/FantasyStory-Windows-x64.zip --clobber --repo rlaxodl0310/-
          gh release edit desktop-v0.1.0-preview --notes-file release/notes.txt --repo rlaxodl0310/-
