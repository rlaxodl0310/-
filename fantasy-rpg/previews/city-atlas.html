const GameGeography={detail:(state,id)=>{const c=CityDistrictData.find(c=>c.id===id);return c?{known:true,name:c.name}:null;}};
const WorldFacilities={list:(state,id)=>atlasFacilities.filter(f=>f.locationId===id)};
(function(r){
'use strict';
const catalog=globalThis.CityDistrictData||[];
function render(container,state,id,{artwork=false,imageURL=null}={}){
 container.replaceChildren();const city=catalog.find(c=>c.id===id);if(!city)return false;const districts=city.districts;imageURL=imageURL||city.asset;
 const place=GameGeography.detail(state,id,{artwork});if(!place||(!place.known&&!artwork))return false;
 const make=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;},root=make('section'),heading=make('h3'),scene=make('div'),detail=make('p','건물을 선택하면 역할을 확인합니다.'),controls=make('div');

 const show=i=>{current=i;const district=districts[i];heading.textContent=city.name+' · '+district.name;scene.replaceChildren();scene.style.backgroundImage='url("'+imageURL+'")';scene.style.backgroundPosition='center '+(district.row*50)+'%';scene.setAttribute('role','group');scene.setAttribute('aria-label',district.name+' 거리와 건물');detail.textContent='건물을 선택하면 역할을 확인합니다.';const caption=make('span',city.name+' | '+district.name);caption.className='city-district-caption';scene.append(caption);
 for(const [type,xy]of Object.entries(district.points)){const f=facilities.find(f=>f.id===id+'-facility-'+type);if(!f)continue;const pin=make('button',f.name.replace(place.name+' · ',''));pin.type='button';pin.className='city-district-building';pin.dataset.cityFacility=f.id;pin.style.left=xy[0]+'%';pin.style.top=xy[1]+'%';pin.onclick=()=>{detail.textContent=f.name+' · '+f.note;};scene.append(pin);}

const atlasRoot=document.getElementById('city-atlas-preview'),atlasSelect=atlasRoot.querySelector('select'),atlasStage=atlasRoot.querySelector('.atlas-stage');

function atlasDraw(){CityPanorama.render(atlasStage,{},atlasSelect.value,{artwork:true,imageURL:atlasImages[atlasSelect.value]});}
function atlasRestore(s){const state=s?.modelContent;if(state?.city&&atlasImages[state.city])atlasSelect.value=state.city;atlasDraw();if(Number.isInteger(state?.district)&&state.district>=0&&state.district<3)atlasStage.querySelector('[data-district="'+state.district+'"]').click();}
