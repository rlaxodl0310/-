(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.GameEconomy=factory();})(globalThis,()=>{
const UNITS=Object.freeze({copper:1,silver:100,gold:100000,platinum:10000000});
const PRICES=[['작은 빵',1,2],['수프와 빵',4,6],['평범한 식당 한 끼',8,12],['고기 식사',15,25],['공동 숙소 1박',15,25],['여관 개인실 1박',40,70],['공동 목욕탕',15,30],['개인 욕실·온수',50,80],['합승 마차',12,20],['마차 대절',60,100],['여행복',100,300],['일반 단검',500,1000],['일반 한손검',2000,4000],['가죽 방어구 한 벌',3000,6000],['맞춤 판금 방어구',20000,50000],['하급 체력 포션',100,200],['하급 마나 포션',200,400]];
const WAGES=[['일반 노동자 일당',30,50],['숙련 노동자 일당',60,100],['전문 장인 일당',100,300],['검소한 1인 하루 생활비',20,30]];
const PLANS={caravan:{min:800,max:1200,party:4,days:4,cost:160,board:true},escort:{min:200,max:300,party:2,days:2,cost:40,board:true},hunt:{min:300,max:500,party:4,days:1,cost:100},dungeon:{min:800,max:1400,party:4,days:3,cost:300},ecology:{min:200,max:400,party:2,days:2,cost:80},mining:{min:200,max:400,party:3,days:1,cost:75,item:'ore_sample'},supply:{min:40,max:70,party:1,days:1,cost:25,materials:100,materialSpend:60,item:'supply_bundle'},rescue:{min:400,max:800,party:3,days:1,cost:120}};
const ITEMS={monster_scrap:{name:'몬스터 재료 견본',base:12},supply_bundle:{name:'납품 물자 묶음',base:60},ore_sample:{name:'광석 견본',base:20}};
function money(n){if(!Number.isSafeInteger(n)||n<0||n>1000000000000)throw Error('금액은 안전한 범위의 동화 정수여야 합니다.');return n;}
function format(n){money(n);if(n===0)return '동화 0닢';const result=[];for(const [unit,label]of [['platinum','백금화'],['gold','금화'],['silver','은화'],['copper','동화']]){const count=Math.floor(n/UNITS[unit]);if(count){result.push(label+' '+count+'닢');n%=UNITS[unit];}}return result.join(' ');}
function convert(count,unit){money(count);if(!Object.hasOwn(UNITS,unit))throw Error('없는 화폐입니다.');return money(count*UNITS[unit]);}
function quote(type){const p=PLANS[type];if(!Object.hasOwn(PLANS,type))throw Error('없는 의뢰 유형입니다.');return {reward:Math.floor((p.min+p.max)/2),partySize:p.party,durationDays:p.days,estimatedCosts:p.cost+(p.materialSpend||0),materialsCap:p.materials||0,estimatedMaterialSpend:p.materialSpend||0,foodLodgingIncluded:!!p.board,deliveryItem:p.item||null,deliveryQuantity:p.item?1:0};}
function estimate(contract,party=contract.partySize,cost=contract.estimatedCosts){if(!Number.isInteger(party)||party<1||party>8)throw Error('인원은 1~8명입니다.');money(cost);const reimbursement=Math.min(contract.estimatedMaterialSpend||0,contract.materialsCap||0,cost),net=contract.reward+reimbursement-cost;return {gross:contract.reward,reimbursement,cost,net,perPerson:Math.floor(net/party),remainder:net-Math.floor(net/party)*party,days:contract.durationDays,perPersonDay:Math.floor(net/party/contract.durationDays)};}
function ledger(){return {version:1,wallet:300,suppliers:0,issuers:{association:5000,merchant:3000},escrow:{},settled:{},inventory:{monster_scrap:5,supply_bundle:2,ore_sample:1},pledged:{},market:{stock:{},demand:{monster_scrap:20,supply_bundle:4,ore_sample:10}},initialTotal:8300};}
function total(l){return l.wallet+l.suppliers+Object.values(l.issuers).reduce((a,b)=>a+b,0)+Object.values(l.escrow).reduce((a,b)=>a+b.total,0);}
function check(l){if(!l||l.version!==1)throw Error('경제 기록이 올바르지 않습니다.');for(const x of [l.wallet,l.suppliers,l.initialTotal,...Object.values(l.issuers),...Object.values(l.escrow).map(x=>x.total)])money(x);if(total(l)!==l.initialTotal)throw Error('경제 장부의 합계가 맞지 않습니다.');return l;}
function reserve(l,id,issuer,contract){check(l);if(l.escrow[id]||l.settled[id])throw Error('중복된 예치 요청입니다.');const amount=money(contract.reward+contract.materialsCap);if(!Object.hasOwn(l.issuers,issuer))throw Error('예산 주체가 없습니다.');if(l.issuers[issuer]<amount)return false;l.issuers[issuer]-=amount;l.escrow[id]={issuer,total:amount,reward:contract.reward,materialsCap:contract.materialsCap};check(l);return true;}
function release(l,id){const e=l.escrow[id];if(!e)return;l.issuers[e.issuer]+=e.total;delete l.escrow[id];delete l.pledged[id];check(l);}
function pledge(l,id,q){if(q.deliveryItem)l.pledged[id]={item:q.deliveryItem,quantity:q.deliveryQuantity};}
function available(l,item){return Math.max(0,(Object.hasOwn(l.inventory,item)?l.inventory[item]:0)-Object.values(l.pledged).filter(p=>p.item===item).reduce((n,p)=>n+p.quantity,0));}
function settle(l,q,proof){check(l);if(l.settled[q.id])return l.settled[q.id];if(proof?.authority!=='engine'||proof.questId!==q.id||proof.objectiveVerified!==true)throw Error('검증된 완료 증빙이 필요합니다.');const e=l.escrow[q.id];if(!e||q.status!=='accepted')throw Error('예치된 수락 의뢰가 아닙니다.');const cost=money(proof.costCopper),material=money(proof.materialCostCopper||0);if(material>cost||material>e.materialsCap)throw Error('재료 비용 증빙이 계약 범위를 벗어났습니다.');if(l.wallet<cost)throw Error('비용을 지불할 파티 공금이 부족합니다.');if(q.deliveryItem&&(!proof.handedOver||(l.inventory[q.deliveryItem]||0)<q.deliveryQuantity))throw Error('납품할 물품과 인계 확인이 필요합니다.');
 const paid=e.reward+material;if(paid>e.total)throw Error('예치금보다 많이 지급할 수 없습니다.');const result={questId:q.id,reward:e.reward,reimbursement:material,cost,net:paid-cost,partySize:q.partySize,perPerson:Math.floor((paid-cost)/q.partySize)};
 l.wallet+=paid-cost;l.suppliers+=cost;l.issuers[e.issuer]+=e.total-paid;if(q.deliveryItem)l.inventory[q.deliveryItem]-=q.deliveryQuantity;delete l.escrow[q.id];delete l.pledged[q.id];l.settled[q.id]=result;check(l);return result;}
function saleQuote(l,item,quantity){if(!Object.hasOwn(ITEMS,item)||!Number.isInteger(quantity)||quantity<1||quantity>1000)throw Error('매각 수량을 확인해 주세요.');if(available(l,item)<quantity)throw Error('보유 수량이 부족하거나 납품에 묶인 재료입니다.');if((l.market.demand[item]||0)<quantity)throw Error('상인의 남은 매입 수요가 부족합니다.');let amount=0;const stock=l.market.stock[item]||0;for(let n=0;n<quantity;n++)amount+=Math.max(1,Math.floor(ITEMS[item].base*100/(100+(stock+n)*10)));if(l.issuers.merchant<amount)throw Error('상인의 매입 자금이 부족합니다.');return amount;}
function sell(l,item,quantity){const amount=saleQuote(l,item,quantity);l.inventory[item]-=quantity;l.market.stock[item]=(l.market.stock[item]||0)+quantity;l.market.demand[item]-=quantity;l.issuers.merchant-=amount;l.wallet+=amount;check(l);return amount;}
function price(index,scenario='normal'){if(!Number.isInteger(index)||!PRICES[index])throw Error('없는 물가 항목입니다.');let percent=100;if(scenario==='road'&&index>=8&&index<=9)percent=125;if(scenario==='dungeon'&&(index===4||index===5||index>=15))percent=125;if(scenario==='collapse'&&(index<=5||index===8||index===9))percent=150;const [name,low,high]=PRICES[index];return{name,low:Math.ceil(low*percent/100),high:Math.ceil(high*percent/100),percent};}
function expense(l,index,scenario){check(l);if(!Number.isInteger(index)||index<0||index>9)throw Error('생활 서비스만 모의 지불할 수 있습니다.');const p=price(index,scenario),amount=Math.floor((p.low+p.high)/2);if(l.wallet<amount)throw Error('파티 공금이 부족합니다.');l.wallet-=amount;l.suppliers+=amount;check(l);return amount;}
return {UNITS,PRICES,WAGES,PLANS,ITEMS,money,format,convert,quote,estimate,ledger,total,check,reserve,release,pledge,available,settle,saleQuote,sell,price,expense};
});

(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory(require('./economy.js'));else root.QuestEngine=factory(root.GameEconomy);})(globalThis,(Money)=>{
const RANKS=['F','E','D','C','B','A','S','SSS','EX'];
const TYPES={caravan:'상인단 호위',escort:'의뢰인 호위',hunt:'몬스터 토벌',dungeon:'던전 공략',ecology:'생태계 조사',mining:'마석 채굴',supply:'재료 조달',rescue:'구조'};
const SCENARIOS={
 road:{name:'교역로 · 운송 지연',facts:['숲길에서 고블린 무리의 출몰이 보고됐다.','상인단의 출발이 지연되고 약초 재고가 부족하다.'],sites:['숲길','역참','약초 군락'],types:['caravan','escort','hunt','ecology','supply'],rank:'E'},
 dungeon:{name:'신규 던전 · 공동 탐사',facts:['폐광에 던전이 발견됐다.','입구의 마석 광맥은 확인됐으나 깊은 구역은 미조사다.','핵 파괴 허가는 발행되지 않았다.'],sites:['폐광 던전 입구','폐광 던전 외곽'],types:['dungeon','ecology','mining','supply','escort'],rank:'D'},
 collapse:{name:'핵 파괴 · 철수 진행',facts:['협회의 핵 파괴 의뢰가 완료됐다.','핵은 세계 시각 0시에 파괴됐다. 48시에 던전이 붕괴한다.','던전 내부에 미귀환 파티가 있다.'],sites:['던전 철수로','입구 임시 거점'],types:['rescue','escort','supply'],rank:'C'},
 aftermath:{name:'붕괴 이후 · 새 생태계',facts:['핵 파괴 48시간 후 던전이 붕괴해 마나로 변했다.','그 자리에 새로운 생태계가 형성됐다.','새 생태계의 생물과 자원은 아직 조사되지 않았다.'],sites:['신생 생태계 경계','관측 야영지'],types:['ecology','escort','supply'],rank:'D'}
};
function clone(v){return JSON.parse(JSON.stringify(v));}
function initial(){return {version:2,hour:8,sequence:0,revision:0,quests:[],economy:Money.ledger(),notices:[]};}
function issuer(type){return ['caravan','escort','supply'].includes(type)?'merchant':'association';}
function restore(state){if(!state||![1,2].includes(state.version)||!Number.isInteger(state.hour)||state.hour<0||!Array.isArray(state.quests)||state.quests.length>120)throw Error('의뢰 저장 형식이 올바르지 않습니다.');const s=clone(state);if(s.version===2){Money.check(s.economy);return s;}s.version=2;s.economy=Money.ledger();s.notices=['이전 게시판의 단위 없는 임시 보수를 새 동화 기준으로 이전했습니다. 본편 자금은 변경하지 않았습니다.'];for(const q of [...s.quests].sort((a,b)=>Number(!!b.accepted)-Number(!!a.accepted))){const price=Money.quote(q.type);q.legacyReward=q.reward;Object.assign(q,price,{rewardUnit:'copper',rewardScope:'contract-total',capacity:1});if(['open','accepted'].includes(q.status)){q.deadline=Math.max(q.deadline,q.postedAt+price.durationDays*24+12);if(q.deadline<=s.hour){q.status=q.accepted?'overdue':'expired';continue;}if(!Money.reserve(s.economy,q.id,issuer(q.type),q))q.status='funding_pending';else if(q.accepted)Money.pledge(s.economy,q.id,q);}}return s;}
function scenario(id,hour){if(!SCENARIOS[id])throw Error('없는 지역 상황입니다.');return SCENARIOS[id==='collapse'&&hour>=48?'aftermath':id];}
function candidates(id,hour){const s=scenario(id,hour);return s.types.map((type,i)=>({key:type,type,rank:s.rank,site:s.sites[i%s.sites.length],facts:s.facts,capacity:1,sharedArea:['dungeon','ecology','rescue'].includes(type),contract:Money.quote(type)}));}
function drafts(id,hour,round=0){return candidates(id,hour).map((c,i)=>({key:c.key,title:c.site+' · '+TYPES[c.type]+' '+['모집','요청','추가 접수'][(round+i)%3],description:c.facts.join(' ')+' '+({caravan:'상인단과 화물을 지정 역참까지 호위해 주세요.',escort:'의뢰인이 목적지에 도착할 때까지 동행해 주세요.',hunt:'보고된 출몰 구역을 수색하고 위협을 제거해 주세요.',dungeon:'다른 파티와 구역을 나눠 외곽을 조사해 주세요. 핵 파괴는 허용되지 않습니다.',ecology:'생물의 흔적과 환경 변화를 기록해 제출해 주세요.',mining:'확인된 입구 광맥에서 마석을 채굴해 인계해 주세요.',supply:'거점에서 요청한 물자를 조달해 인계해 주세요.',rescue:'미귀환 파티를 수색하고 철수를 도와주세요.'}[c.type]),risk:'보고되지 않은 위험이 있을 수 있습니다. 현장 정보는 미확인입니다.'}));}
function expire(s,exceptId=null){for(const q of s.quests)if(q.id!==exceptId&&['open','accepted','funding_pending'].includes(q.status)&&q.deadline<=s.hour){q.status=q.accepted?'overdue':'expired';Money.release(s.economy,q.id);}}
function refresh(state,id,rows,source){const next=restore(state);if(id==='collapse'&&next.hour>=48)id='aftermath';const cs=candidates(id,next.hour);if(!Array.isArray(rows)||rows.length<1||rows.length>8)throw Error('의뢰는 1~8개여야 합니다.');const used=new Set();next.notices=[];expire(next);for(const q of next.quests)if(q.status==='funding_pending'&&Money.reserve(next.economy,q.id,issuer(q.type),q)){q.status=q.accepted?'accepted':'open';if(q.accepted)Money.pledge(next.economy,q.id,q);}
 for(const row of rows){const c=cs.find(c=>c.key===row.key);if(!c||used.has(row.key)||Object.keys(row).some(k=>!['key','title','description','risk'].includes(k)))throw Error('지역 상황과 맞지 않는 의뢰입니다.');used.add(row.key);for(const [k,max]of [['title',80],['description',700],['risk',240]])if(typeof row[k]!=='string'||!row[k].trim()||row[k].length>max)throw Error('의뢰 설명 형식이 잘못되었습니다.');
 const signature=id+':'+c.key;if(next.quests.some(q=>q.signature===signature&&['open','accepted','funding_pending'].includes(q.status)))continue;
 if(next.quests.length>=120){const old=next.quests.findIndex(q=>['expired','overdue','completed'].includes(q.status)&&!next.economy.escrow[q.id]);if(old<0){next.notices.push('보관 가능한 의뢰 수에 도달했습니다.');break;}next.quests.splice(old,1);}
 const q={...clone(row),...c.contract,id:'quest-'+(next.sequence+1),signature,scenario:id,type:c.type,rank:c.rank,site:c.site,client:issuer(c.type)==='merchant'?'지역 상인 조합':'협회 접수처',rewardUnit:'copper',rewardScope:'contract-total',merit:5*(RANKS.indexOf(c.rank)+1),capacity:1,sharedArea:c.sharedArea,joined:0,accepted:false,status:'open',source,postedAt:next.hour,deadline:Math.min(next.hour+c.contract.durationDays*24+12,id==='collapse'?48:Infinity),coreDestructionAuthorized:false,objective:TYPES[c.type]+' 수행 후 증빙 제출'};
 if(!Money.reserve(next.economy,q.id,issuer(c.type),q)){next.notices.push(TYPES[c.type]+': 의뢰인 예치금 또는 협회 예산 부족으로 게시 보류');continue;}next.sequence++;next.quests.push(q);}
 next.revision++;Money.check(next.economy);return next;}
function advance(state,hours=6){if(!Number.isInteger(hours)||hours<1||hours>48)throw Error('시간 범위를 확인해 주세요.');const n=restore(state);n.hour+=hours;n.revision++;expire(n);return n;}
function accept(state,id,rank='D'){const n=restore(state),q=n.quests.find(q=>q.id===id);if(!q||q.status!=='open'||q.deadline<=n.hour)throw Error('접수가 마감된 의뢰입니다.');if(q.accepted)throw Error('이미 수락한 의뢰입니다.');if(!RANKS.includes(rank)||RANKS.indexOf(rank)<RANKS.indexOf(q.rank))throw Error('신청 랭크가 부족합니다.');if(!n.economy.escrow[id])throw Error('보수 예치가 필요합니다.');q.accepted=true;q.joined=1;q.status='accepted';Money.pledge(n.economy,id,q);n.revision++;return n;}
function complete(state,id,proof){const n=restore(state),q=n.quests.find(q=>q.id===id);if(n.economy.settled[id])return n;if(!q||q.status!=='accepted')throw Error('수락한 의뢰가 아닙니다.');if(proof?.authority!=='engine'||proof.questId!==id||!Number.isInteger(proof.elapsedHours)||proof.elapsedHours<q.durationDays*24)throw Error('검증된 수행 시간과 완료 증빙이 필요합니다.');n.hour+=proof.elapsedHours;if(n.hour>q.deadline)throw Error('기한을 넘긴 의뢰입니다.');if(Object.keys(n.economy.settled).length>=10000)throw Error('정산 기록 한도에 도달했습니다.');const receipt=Money.settle(n.economy,q,proof);q.status='completed';q.completedAt=n.hour;q.receipt=receipt;expire(n,id);n.revision++;return n;}
