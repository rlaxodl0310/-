<style>

<script>
const SceneStage=(()=>{
 const backgrounds={earth_subway:'assets/bg-subway.png',subway:'assets/bg-subway.png',earth_platform:'assets/bg-platform.png',platform:'assets/bg-platform.png',earth_station:'assets/bg-station.png',station:'assets/bg-station.png'};
 const characters={yeogyeong:'assets/yeogyeong-standing.png',yui:'assets/yui-standing.png',seoha:'assets/seoha-standing.png','dogyeom-childhood-friend':'assets/childhood-friend-standing.png'};
 function render({background,portrait,location,characterId,emotion=0}){const bg=backgrounds[location]||backgrounds.earth_subway;const character=characters[characterId];background.style.backgroundImage='url("'+bg+'")';background.style.backgroundSize='cover';background.style.backgroundPosition='center';background.dataset.location=location;background.dataset.cutscene='false';portrait.hidden=!character;portrait.dataset.character=characterId||'';portrait.dataset.emotion=String(emotion);portrait.style.backgroundImage=character?'url("'+character+'")':'none';portrait.style.backgroundSize='contain';portrait.style.backgroundPosition='center bottom';portrait.style.backgroundRepeat='no-repeat';portrait.style.border='none';portrait.style.outline='none';portrait.setAttribute('aria-label',({yui:'한유이',yeogyeong:'차여경',seoha:'윤서하','dogyeom-childhood-friend':'도겸의 소꿉친구'})[characterId]+' 전신');}
 function cutscene(background,portrait,url,panel){background.style.backgroundImage='url("'+url+'")';background.style.backgroundSize=panel===undefined?'cover':'200% 100%';background.style.backgroundPosition=panel===undefined?'center':panel*100+'% center';background.dataset.cutscene='true';portrait.hidden=true;}
 return {render,cutscene,backgrounds,characters};
})();

(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.QuestEngine=factory();})(globalThis,()=>{
const RANKS=['F','E','D','C','B','A','S','SSS','EX'];
const TYPES={caravan:'상인단 호위',escort:'의뢰인 호위',hunt:'몬스터 토벌',dungeon:'던전 공략',ecology:'생태계 조사',mining:'마석 채굴',supply:'재료 조달',rescue:'구조'};
const SCENARIOS={
 road:{name:'교역로 · 운송 지연',facts:['숲길에서 고블린 무리의 출몰이 보고됐다.','상인단의 출발이 지연되고 약초 재고가 부족하다.'],sites:['숲길','역참','약초 군락'],types:['caravan','escort','hunt','ecology','supply'],rank:'E'},
 dungeon:{name:'신규 던전 · 공동 탐사',facts:['폐광에 던전이 발견됐다.','입구의 마석 광맥은 확인됐으나 깊은 구역은 미조사다.','핵 파괴 허가는 발행되지 않았다.'],sites:['폐광 던전 입구','폐광 던전 외곽'],types:['dungeon','ecology','mining','supply','escort'],rank:'D'},
 collapse:{name:'핵 파괴 · 철수 진행',facts:['협회의 핵 파괴 의뢰가 완료됐다.','핵은 세계 시각 0시에 파괴됐다. 48시에 던전이 붕괴한다.','던전 내부에 미귀환 파티가 있다.'],sites:['던전 철수로','입구 임시 거점'],types:['rescue','escort','supply'],rank:'C'},
 aftermath:{name:'붕괴 이후 · 새 생태계',facts:['핵 파괴 48시간 후 던전이 붕괴해 마나로 변했다.','그 자리에 새로운 생태계가 형성됐다.','새 생태계의 생물과 자원은 아직 조사되지 않았다.'],sites:['신생 생태계 경계','관측 야영지'],types:['ecology','escort','supply'],rank:'D'}
};
function clone(v){return JSON.parse(JSON.stringify(v));}
function initial(){return {version:1,hour:8,sequence:0,revision:0,quests:[]};}
function scenario(id,hour){if(!SCENARIOS[id])throw Error('없는 지역 상황입니다.');return SCENARIOS[id==='collapse'&&hour>=48?'aftermath':id];}
function candidates(id,hour){const s=scenario(id,hour);return s.types.map((type,i)=>({key:type,type,rank:s.rank,site:s.sites[i%s.sites.length],facts:s.facts,capacity:['hunt','dungeon','ecology','rescue'].includes(type)?4:1}));}
function drafts(id,hour,round=0){return candidates(id,hour).map((c,i)=>({key:c.key,title:c.site+' · '+TYPES[c.type]+' '+['모집','요청','추가 접수'][(round+i)%3],description:c.facts.join(' ')+' '+({caravan:'상인단과 화물을 지정 역참까지 호위해 주세요.',escort:'의뢰인이 목적지에 도착할 때까지 동행해 주세요.',hunt:'보고된 출몰 구역을 수색하고 위협을 제거해 주세요.',dungeon:'다른 파티와 구역을 나눠 외곽을 조사해 주세요. 핵 파괴는 허용되지 않습니다.',ecology:'생물의 흔적과 환경 변화를 기록해 제출해 주세요.',mining:'확인된 입구 광맥에서 마석을 채굴해 인계해 주세요.',supply:'거점에서 요청한 물자를 조달해 인계해 주세요.',rescue:'미귀환 파티를 수색하고 철수를 도와주세요.'}[c.type]),risk:'보고되지 않은 위험이 있을 수 있습니다. 현장 정보는 미확인입니다.'}));}
function refresh(state,id,rows,source){const next=clone(state);if(id==='collapse'&&next.hour>=48)id='aftermath';const cs=candidates(id,next.hour);if(!Array.isArray(rows)||rows.length<1||rows.length>8)throw Error('의뢰는 1~8개여야 합니다.');const used=new Set();
 for(const row of rows){const c=cs.find(c=>c.key===row.key);if(!c||used.has(row.key)||Object.keys(row).some(k=>!['key','title','description','risk'].includes(k)))throw Error('지역 상황과 맞지 않는 의뢰입니다.');used.add(row.key);for(const [k,max]of [['title',80],['description',700],['risk',240]])if(typeof row[k]!=='string'||!row[k].trim()||row[k].length>max)throw Error('의뢰 설명 형식이 잘못되었습니다.');
 const signature=id+':'+c.key;if(next.quests.some(q=>q.signature===signature&&['open','accepted'].includes(q.status)))continue;
 const rank=RANKS.indexOf(c.rank);next.quests.push({...clone(row),id:'quest-'+(++next.sequence),signature,scenario:id,type:c.type,rank:c.rank,site:c.site,client:['caravan','supply'].includes(c.type)?'지역 상인 조합':'협회 접수처',reward:20*(rank+1)*(c.type==='dungeon'?3:1),merit:5*(rank+1),capacity:c.capacity,joined:0,accepted:false,status:'open',source,postedAt:next.hour,deadline:Math.min(next.hour+24,id==='collapse'?48:Infinity),coreDestructionAuthorized:false,objective:TYPES[c.type]+' 수행 후 증빙 제출'});}
 next.revision++;next.quests=next.quests.slice(-120);return next;}
function advance(state,hours=6){if(!Number.isInteger(hours)||hours<1||hours>48)throw Error('시간 범위를 확인해 주세요.');const n=clone(state);n.hour+=hours;n.revision++;for(const q of n.quests){if(['open','accepted'].includes(q.status)&&q.deadline<=n.hour)q.status=q.accepted?'overdue':'expired';}return n;}
function accept(state,id,rank='D'){const n=clone(state),q=n.quests.find(q=>q.id===id);if(!q||q.status!=='open'||q.deadline<=n.hour)throw Error('접수가 마감된 의뢰입니다.');if(q.accepted)throw Error('이미 수락한 의뢰입니다.');if(!RANKS.includes(rank)||RANKS.indexOf(rank)<RANKS.indexOf(q.rank))throw Error('신청 랭크가 부족합니다.');if(q.joined>=q.capacity)throw Error('모집 인원이 찼습니다.');q.accepted=true;q.joined++;q.status='accepted';n.revision++;return n;}
return {RANKS,TYPES,SCENARIOS,initial,scenario,candidates,drafts,refresh,advance,accept};
});

const AssociationUI=(()=>{
 const n=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
 function b(text,fn){const e=n('button',text);e.type='button';e.onclick=fn;return e;}
 async function call(method,arg){if(!window.associationAPI)throw Error('Windows 앱에서 사용할 수 있습니다.');const r=await window.associationAPI[method](arg);if(!r.ok)throw Error(r.error);return r.data;}
 async function panel(body){
 const settings=n('details'),summary=n('summary','게시판 테스트 설정');settings.className='quest-test-settings';settings.append(summary,n('p','본편과 별도인 게시판 테스트입니다. 신청자 D랭크, 금액과 공적치는 임시 수치입니다.'));const controls=n('div'),select=n('select');select.setAttribute('aria-label','지역 상황');for(const [key,s]of Object.entries(QuestEngine.SCENARIOS)){const o=n('option',s.name);o.value=key;select.append(o);}controls.append(select);settings.append(controls);
 const status=n('p'),board=n('div'),list=n('div'),detail=n('dialog');board.className='wooden-quest-board';list.className='quest-paper-grid';detail.className='quest-document';detail.setAttribute('aria-label','의뢰서 상세');status.setAttribute('role','status');board.append(list);body.append(status,board,settings,detail);let state,working=false,selected=null;
 function setBusy(value){for(const e of controls.querySelectorAll('button,select'))e.disabled=value;for(const e of list.querySelectorAll('button'))e.disabled=value;for(const e of detail.querySelectorAll('[data-accept]'))e.disabled=value||e.dataset.locked==='true';}
 async function run(fn){if(working)return;working=true;setBusy(true);status.textContent='협회 접수 기록을 확인하고 있습니다…';try{state=await fn();working=false;render();}catch(e){status.textContent=e.message;}finally{working=false;setBusy(false);}}
 controls.append(b('AI로 새 의뢰 생성',()=>run(()=>call('refresh',{scenario:select.value,ai:true}))),b('로컬 예제 생성',()=>run(()=>call('refresh',{scenario:select.value,ai:false}))),b('6시간 경과',()=>run(()=>call('advance'))));settings.append(b('AI 요청 취소',()=>window.desktopAI?.cancel()));
 function show(q){if(!q)return;selected=q.id;detail.replaceChildren();const heading=n('div');heading.className='quest-document-heading';heading.append(n('span','ASSOCIATION · OFFICIAL REQUEST'));const close=b('닫기',()=>{selected=null;if(detail.close)detail.close();else detail.removeAttribute('open');});close.setAttribute('aria-label','의뢰서 닫기');heading.append(close);const rank=n('div',q.rank);rank.className='quest-document-rank';detail.append(heading,rank,n('h3',q.title),n('p',q.description));const facts=n('dl');for(const [label,value]of [['의뢰인',q.client],['장소',q.site],['신청 조건',q.rank+'랭크 이상'],['모집 규모',q.capacity+'파티'],['완료 기한','세계 시각 '+q.deadline+'시'],['예정 보수',q.reward+' · 공적 '+q.merit],['알려진 위험',q.risk],['핵 파괴 허가','없음']])facts.append(n('dt',label),n('dd',value));detail.append(facts,n('p','완료 증빙을 제출하고 협회의 확인을 거쳐 보수를 받습니다.'));const accept=b(q.accepted?'수락한 의뢰':QuestEngine.RANKS.indexOf(q.rank)>2?'현재 랭크로 신청 불가':'의뢰 수락',()=>run(()=>call('accept',{id:q.id})));accept.dataset.accept='true';accept.dataset.locked=String(q.status!=='open'||QuestEngine.RANKS.indexOf(q.rank)>2);accept.disabled=working||accept.dataset.locked==='true';detail.append(accept);if(!detail.open){if(detail.showModal)detail.showModal();else detail.setAttribute('open','');}}
 detail.addEventListener('close',()=>{selected=null;});
 function render(){status.textContent='세계 시각 '+state.hour+'시 · 수락한 의뢰 '+state.quests.filter(q=>q.accepted).length+'건';list.replaceChildren();for(const q of state.quests){const label={open:'모집 중',accepted:'수락함',overdue:'기한 초과',expired:'마감'}[q.status],paper=b('',()=>show(q));paper.className='quest-paper';paper.dataset.state=q.status;paper.setAttribute('aria-label','['+q.rank+'] '+q.title+' · '+label);const rank=n('span',q.rank+' RANK'),type=n('span',QuestEngine.TYPES[q.type]);rank.className='paper-rank';type.className='paper-type';const title=n('strong',q.title),excerpt=n('span',q.description.slice(0,70)+'…'),reward=n('span','보수 '+q.reward+' · 공적 '+q.merit),stamp=n('span',label);excerpt.className='paper-excerpt';reward.className='paper-reward';stamp.className='paper-stamp';paper.append(rank,type,title,excerpt,reward,stamp);list.append(paper);}if(!state.quests.length){const empty=n('p','아직 접수된 의뢰가 없습니다.');empty.className='quest-board-empty';list.append(empty);settings.open=true;}if(selected)show(state.quests.find(q=>q.id===selected));}
 await run(()=>call('list'));
 }
 async function story(body){body.append(n('p','실시간 AI 이야기 테스트 · 현실 등굣길부터 시작합니다. 본편 저장과 별도이며 새 이미지를 생성하지 않고 기존 표정 일러스트를 연출합니다.'));
 const stage=n('div'),backdrop=n('div'),image=n('div');stage.className='story-live-stage';backdrop.className='story-live-background';image.className='story-live-portrait';stage.append(backdrop,image);image.setAttribute('role','img');image.setAttribute('aria-label','차여경 표정');const place=n('h3'),lines=n('div'),history=n('details'),sum=n('summary','지난 대화'),past=n('div'),form=n('form'),input=n('textarea'),status=n('p');input.maxLength=1000;input.placeholder='김태이로서 말하거나 행동하세요.';input.setAttribute('aria-label','김태이의 말과 행동');status.setAttribute('role','status');history.append(sum,past);form.append(input);const send=n('button','다음 장면');send.type='submit';form.append(send);const cancel=b('생성 취소',async()=>{await window.desktopAI?.cancel();});body.append(place,stage,lines,history,form,cancel,status);let state,working=false,pending=null;
 function render(){place.textContent=({subway:'등굣길 · 지하철',platform:'현실 · 승강장',station:'현실 · 역 대합실'})[state.location];SceneStage.render({background:backdrop,portrait:image,location:state.location,characterId:'yeogyeong',emotion:state.emotion});lines.replaceChildren();for(const p of state.panels)lines.append(n('p',(p.speaker==='yeogyeong'?'차여경: ':'')+p.text));past.replaceChildren();for(const t of state.turns){past.append(n('p','김태이: '+t.text));for(const p of t.panels)past.append(n('p',(p.speaker==='yeogyeong'?'차여경: ':'')+p.text));}}
 try{state=await call('storyState');render();}catch(e){status.textContent=e.message;return;}
 form.onsubmit=async e=>{e.preventDefault();if(working||!input.value.trim())return;working=true;send.disabled=true;input.disabled=true;status.textContent='이전 상황을 읽고 다음 장면을 만드는 중…';const text=input.value.trim();if(!pending||pending.text!==text)pending={text,requestId:crypto.randomUUID(),revision:state.revision};try{state=await call('storySend',pending);pending=null;input.value='';render();status.textContent='장면과 기억을 저장했습니다.';}catch(err){status.textContent=err.message;}finally{working=false;send.disabled=false;input.disabled=false;}};
 body.append(b('테스트 이야기 처음부터',async()=>{if(working||!confirm('이 테스트의 대화 기억을 초기화할까요? 본편 저장은 유지됩니다.'))return;try{state=await call('storyReset');pending=null;render();status.textContent='초기화했습니다.';}catch(e){status.textContent=e.message;}}));
 }

(()=>{
 const root=document.getElementById('fantasy-stage-preview'),q=s=>root.querySelector(s),place=q('[data-place]'),person=q('[data-person]'),backdrop=q('.preview-background'),portrait=q('.preview-character');
 for(const [key,value]of Object.entries(SceneStage.backgrounds))SceneStage.backgrounds[key]=previewImages[value.split('/').pop()];for(const [key,value]of Object.entries(SceneStage.characters))SceneStage.characters[key]=previewImages[value.split('/').pop()];
 let quests=QuestEngine.refresh(QuestEngine.initial(),'road',QuestEngine.drafts('road',8).slice(0,3),'local');
 function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'배경·전신·종이 게시판',location:place.value,character:person.value,accepted:quests.quests.filter(q=>q.accepted).map(q=>q.title)},privateContent:{location:place.value,character:person.value}}).catch(()=>{});}
 function render(){SceneStage.render({background:backdrop,portrait,location:place.value,characterId:person.value});q('.preview-place').textContent='현실 · '+({subway:'지하철',platform:'승강장',station:'대합실'})[place.value];}
 function restore(s){const p=s?.privateContent;if(p){if(['subway','platform','station'].includes(p.location))place.value=p.location;if(SceneStage.characters[p.character])person.value=p.character;}render();}
 place.onchange=person.onchange=()=>{render();remember();};
 for(const button of root.querySelectorAll('[data-view]'))button.onclick=()=>{const scene=button.dataset.view==='scene';q('[data-scene-view]').hidden=!scene;q('[data-board-view]').hidden=scene;for(const b of root.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));};
 window.associationAPI={list:async()=>({ok:true,data:quests}),refresh:async r=>r.ai?{ok:false,error:'실제 AI 생성은 Windows 앱의 ChatGPT 연결로 사용할 수 있습니다.'}:{ok:true,data:quests=QuestEngine.refresh(quests,r.scenario,QuestEngine.drafts(r.scenario,quests.hour).slice(0,3),'local')},accept:async r=>{try{quests=QuestEngine.accept(quests,r.id,'D');remember();return{ok:true,data:quests};}catch(e){return{ok:false,error:e.message};}},advance:async()=>({ok:true,data:quests=QuestEngine.advance(quests,6)})};
 AssociationUI.panel(q('#panel-body'));restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
