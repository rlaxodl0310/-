(()=>{
 const root=document.getElementById('fantasy-stage-preview'),q=s=>root.querySelector(s),place=q('[data-place]'),person=q('[data-person]'),backdrop=q('.preview-background'),portrait=q('.preview-character');
 for(const [key,value]of Object.entries(SceneStage.backgrounds))SceneStage.backgrounds[key]=previewImages[value.split('/').pop()];for(const [key,value]of Object.entries(SceneStage.characters))SceneStage.characters[key]=previewImages[value.split('/').pop()];
 for(const [key,value]of Object.entries(SceneStage.faces))SceneStage.faces[key]=previewImages[value.split('/').pop()];
 let quests=QuestEngine.refresh(QuestEngine.initial(),'road',QuestEngine.drafts('road',8).slice(0,3),'local');
 function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'배경·전신·종이 게시판',location:place.value,character:person.value,accepted:quests.quests.filter(q=>q.accepted).map(q=>q.title)},privateContent:{revision:'soyun-integrated-1',location:place.value,character:person.value}}).catch(()=>{});}
 function render(){SceneStage.render({background:backdrop,portrait,location:place.value,characterId:person.value});q('.preview-place').textContent='현실 · '+({subway:'지하철',platform:'승강장',station:'대합실'})[place.value];}
 function restore(s){const p=s?.privateContent;if(p?.revision==='soyun-integrated-1'){if(['subway','platform','station'].includes(p.location))place.value=p.location;if(SceneStage.characters[p.character])person.value=p.character;}render();}
 place.onchange=person.onchange=()=>{render();remember();};
 for(const button of root.querySelectorAll('[data-view]'))button.onclick=()=>{const scene=button.dataset.view==='scene';q('[data-scene-view]').hidden=!scene;q('[data-board-view]').hidden=scene;for(const b of root.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));};
 window.associationAPI={list:async()=>({ok:true,data:quests}),refresh:async r=>r.ai?{ok:false,error:'실제 AI 생성은 Windows 앱의 ChatGPT 연결로 사용할 수 있습니다.'}:{ok:true,data:quests=QuestEngine.refresh(quests,r.scenario,QuestEngine.drafts(r.scenario,quests.hour).slice(0,3),'local')},accept:async r=>{try{quests=QuestEngine.accept(quests,r.id,'D');remember();return{ok:true,data:quests};}catch(e){return{ok:false,error:e.message};}},advance:async()=>({ok:true,data:quests=QuestEngine.advance(quests,6)})};
 AssociationUI.panel(q('#panel-body'));restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
