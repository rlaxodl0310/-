const decorate=()=>{for(const b of districtRoot.querySelectorAll('button'))b.classList.add('btn');};decorate();
const restoreDistrict=s=>{const i=s?.modelContent?.district;const b=districtRoot.querySelector('[data-district="'+i+'"]');if(b)b.click();decorate();};
restoreDistrict(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>restoreDistrict(e.detail?.globals?.widgetState));
districtRoot.addEventListener('click',e=>{decorate();if(!e.target.closest('button'))return;const active=districtRoot.querySelector('[data-district][aria-pressed=true]');if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{city:'발크',district:Number(active?.dataset.district||0)},privateContent:null}).catch(()=>{});});
</script>
