 const root=make('section'),heading=make('h3',place.name+' · '+(art.kind==='village'?'마을':'야생지역')),scene=make('div'),caption=make('span',place.name),c=GameGeography.continent?.(art.continent);

const adventureRoot=document.getElementById('city-layout-revision'),adventureSelect=adventureRoot.querySelector('select'),adventureStage=adventureRoot.querySelector('.adventure-stage');
for(const [kind,label]of [['city','도시'],['village','마을'],['wilderness','야생지역']]){const group=document.createElement('optgroup');group.label=label;for(const c of adventureLocations.filter(c=>c.kind===kind)){const option=document.createElement('option');option.value=c.id;option.textContent=c.name+' · '+(adventureContinents[c.continent]?.direction||'');group.append(option);}adventureSelect.append(group);}
function adventureDraw(){CityPanorama.render(adventureStage,{},adventureSelect.value,{artwork:true,imageURL:adventureImages[adventureSelect.value]});}
function adventureRestore(s){const state=s?.modelContent;if(state?.location&&adventureImages[state.location])adventureSelect.value=state.location;adventureDraw();if(Number.isInteger(state?.district)){const b=adventureStage.querySelector('[data-district="'+state.district+'"]');if(b)b.click();}}
function adventureSave(){if(!window.openai?.setWidgetState)return;const d=adventureStage.querySelector('[data-district][aria-pressed=true]');window.openai.setWidgetState({modelContent:{location:adventureSelect.value,district:d?Number(d.dataset.district):null},privateContent:null}).catch(()=>{});}
adventureRestore(window.openai?.widgetState);adventureSelect.addEventListener('change',()=>{adventureDraw();adventureSave();});adventureStage.addEventListener('click',e=>{if(e.target.closest('button'))adventureSave();});window.addEventListener('openai:set_globals',e=>adventureRestore(e.detail?.globals?.widgetState));
