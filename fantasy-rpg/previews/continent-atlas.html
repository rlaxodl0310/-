(function(root){
  class Engine{
    constructor(data){this.data=data;this.state={active:null,completed:[],minutes:0,flags:[],visitedLocations:[],currentLocation:null};this.history=[];}
    event(id){const e=this.data.events.find(e=>e.id===id);if(!e)throw Error('없는 이벤트입니다.');return e;}
    current(){const a=this.state.active;return a?this.event(a.id).nodes[a.node]:null;}
    start(id,context){
      if(this.state.active)throw Error('진행 중인 이벤트부터 이어 주세요.');
      const e=this.event(id);
      if(this.state.completed.includes(id))throw Error('이미 완료한 이벤트입니다.');
      if((e.requiresCompleted||[]).some(id=>!this.state.completed.includes(id)))throw Error('앞선 이야기를 먼저 진행해 주세요.');
      if(!context||context.location!==e.location||!Array.isArray(context.members)||e.members.some(m=>!context.members.includes(m)))throw Error('장소나 참여 인물 조건이 맞지 않습니다.');
      if(e.viewer&&context.viewer!==e.viewer)throw Error('대화 상대 조건이 맞지 않습니다.');
      this.state.active={id,node:e.entry,pendingMinutes:0};
      this.state.currentLocation=e.location;
      if(!this.state.visitedLocations.includes(e.location))this.state.visitedLocations.push(e.location);
      this.history.push({type:'start',id,context:{location:context.location,members:[...context.members],...(e.viewer?{viewer:context.viewer}:{})}});
    }
    abandon(){if(!this.state.active)throw Error('진행 중인 이벤트가 없습니다.');this.state.active=null;this.history.push({type:'abandon'});}
    advance(choiceId=null){
      const a=this.state.active;if(!a)throw Error('진행 중인 이벤트가 없습니다.');
      const e=this.event(a.id),n=e.nodes[a.node];
      if(n.end){
        this.state.minutes+=a.pendingMinutes;
        this.state.completed.push(a.id);
        this.state.flags=[...new Set([...this.state.flags,...(n.flags||[])])];
        this.state.active=null;
      }else{
        let next=n.next,minutes=0;
        if(n.choices){const choice=n.choices.find(c=>c.id===choiceId);if(!choice)throw Error('선택지를 골라 주세요.');next=choice.next;minutes=choice.minutes||0;}
        else if(choiceId!==null)throw Error('현재 장면에는 그 선택지가 없습니다.');
        if(!e.nodes[next])throw Error('잘못된 장면 연결입니다.');
        a.pendingMinutes+=minutes;a.node=next;

    }

        if(action.type==='start')engine.start(action.id,action.context);
        else if(action.type==='abandon')engine.abandon();
        else if(action.type==='advance')engine.advance(action.choiceId??null);
        else throw Error('잘못된 저장 동작입니다.');
      }
      return engine;
    }
  }

(()=>{const root=document.getElementById('erdia-atlas'),get=id=>root.querySelector('#'+id),M=ExplorationMap;
const data={version:1,events:M.regions.flatMap(r=>M.cells(r.id).map(c=>({id:c.id,location:c.id,members:[],entry:'arrive',nodes:{arrive:{end:true}}})))};let engine=new StoryKitEngine(data),selected=null;
function render(){const fog=get('atlas-fog').checked;get('atlas-travel').hidden=!selected;get('atlas-back').disabled=!selected;const known=M.snapshot(engine.state).continents.filter(c=>c.known).length;get('atlas-status').textContent=(fog?'탐험 가림 적용':'지도 원화 보기')+' · 방문 대륙 '+known+'/5 · 방문 구역 '+engine.state.visitedLocations.length+'/45';if(selected){M.renderContinent(get('atlas-map'),engine.state,selected,{artwork:!fog,imageURL:atlasImages[selected]});const options=get('atlas-region'),old=options.value;options.replaceChildren();for(const [i,c] of M.cells(selected).entries()){const o=document.createElement('option');o.value=c.id;o.textContent=(fog&&!engine.state.visitedLocations.includes(c.id)?'미방문 구역 '+(i+1):c.name)+' · 시연 목적지';options.append(o);}if([...options.options].some(o=>o.value===old))options.value=old;}else M.render(get('atlas-map'),engine.state,{view:'world',artwork:!fog,imageURL:atlasImages.world,onSelect:id=>{selected=id;render();save();}});}
function save(){window.openai?.setWidgetState({modelContent:{selected,fog:get('atlas-fog').checked,visited:engine.state.visitedLocations},privateContent:{selected,fog:get('atlas-fog').checked,engine:engine.serialize()}})?.catch(()=>{});}
function restore(s){try{if(s?.privateContent?.engine)engine=StoryKitEngine.restore(data,s.privateContent.engine);selected=M.regions.some(r=>r.id===s?.privateContent?.selected)?s.privateContent.selected:null;get('atlas-fog').checked=s?.privateContent?.fog===true;}catch{}render();}
get('atlas-back').onclick=()=>{selected=null;render();save();};get('atlas-fog').onchange=()=>{render();save();};get('atlas-go').onclick=()=>{const id=get('atlas-region').value;if(engine.state.active)engine.abandon();engine.start(id,{location:id,members:[]});render();save();};restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});})();
</script>
