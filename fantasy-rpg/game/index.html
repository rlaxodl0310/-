<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121714"><title>이세계 기록 · 이야기의 시작</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="engine.js"></script><script defer src="core.js"></script><script defer src="ai.js"></script><script defer src="app.js"></script></head>
<body><div class="app"><nav class="rail" aria-label="메뉴"><a class="sigil" href="#" aria-label="이세계 기록 홈">✧</a><button data-panel="chapters" title="장면 선택">◈<span>이야기</span></button><button data-panel="status" title="상태창">♙<span>상태창</span></button><button data-panel="cast" title="인물 제작실">♧<span>인물</span></button><button data-panel="journal" title="대화 기록">☷<span>기록</span></button><div class="rail-bottom"><button data-panel="saves" title="저장과 불러오기">▣<span>저장</span></button><button data-panel="settings" title="설정">⚙<span>설정</span></button></div></nav>
<main><header><div class="brand">이세계 기록 <span>INTERACTIVE STORY</span></div><div class="header-right"><button id="ai-mode" data-panel="settings" class="mode" type="button">○ 체험 모드 · AI 시작</button><button id="save-now" class="outline">빠른 저장</button></div></header>
<section class="scene" aria-label="현재 이야기 장면"><div id="scene-art"></div><div class="vignette"></div><div class="scene-top"><div><div class="eyebrow">CHARACTER EPISODE <span id="episode-no">01</span></div><h1 id="scene-title">지도와 이정표</h1><p id="scene-place">낯선 세계의 갈림길</p></div><div class="scene-time"><span>검토용 장면</span><strong id="elapsed">0분</strong></div></div>
<button class="history-toggle outline" data-panel="journal">☷ 대화 기록</button><div class="scene-caption"><span class="dot"></span> 본편과 별개인 이야기 체험 <span class="line"></span></div>
<div class="dialogue-wrap"><div class="speaker-row"><span id="speaker">김태이</span><span id="emotion">생각 중</span><span class="dialogue-rule"></span><button id="sd-toggle" title="SD 상황 컷 표시">SD</button></div><div class="dialogue"><p id="line" aria-live="polite"></p><div id="sd" hidden></div></div><div id="choices"></div><form id="chat-form"><label class="sr-only" for="chat-input">대화나 행동 입력</label><input id="chat-input" autocomplete="off" maxlength="500" placeholder="어떤 말을 건넬까요? 행동을 적어도 좋아요."><button aria-label="메시지 보내기" type="submit">↗</button></form><div class="dialogue-footer"><span>직접 입력하거나 위의 선택지로 진행하세요</span><span id="save-state" role="status">브라우저에 자동 저장</span></div></div></section>
<footer><span>✧ <b>김태이</b> <small>Lv. 1</small></span><span class="footer-trait">고유 특성 <b>제로 · 동반자</b></span><span>정수 슬롯 <b>0 / 1</b></span><button data-panel="chapters">다른 장면 보기 →</button></footer></main>
<div id="scrim" hidden></div><aside id="panel" hidden aria-labelledby="panel-title"><div class="panel-head"><div><span class="eyebrow">STORY ARCHIVE</span><h2 id="panel-title"></h2></div><button id="close-panel" aria-label="닫기">×</button></div><div id="panel-body"></div></aside><div id="toast" role="status" hidden></div></div></body></html>
