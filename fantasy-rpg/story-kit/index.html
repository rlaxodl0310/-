<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이세계 이야기 · 표정과 이벤트 미리보기</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="engine.js"></script><script defer src="app.js"></script></head><body><main>
<header><span>FANTASY · CHARACTER & SCENE KIT</span><button id="reset">연습 기록 초기화</button></header><h1>표정에서 장면으로.</h1><p class="note">본편과 별개의 제작용 연습판 · 각 인물 중심의 개별 상황이며, 여경의 교복 이벤트만 태이를 대화 상대로 둡니다. 동행이나 합류를 전제하지 않습니다. 자유 AI 대화가 아닌 작성형 이벤트입니다.</p>
<div id="status" role="status"></div><p id="error" role="alert"></p>
<section id="menu"><h2>상호작용 이벤트</h2><div id="events" class="event-list"></div><button id="resume" hidden>중단한 대화 이어가기</button></section>
<section id="player" hidden><button id="pause">잠시 멈추고 목록으로</button><h2 id="event-title"></h2><img id="cg" alt="현재 이벤트 컷신"><div class="dialogue"><div id="portrait" class="tile"></div><div><strong id="speaker"></strong><p id="line" aria-live="polite"></p><span id="emotion"></span></div></div><div id="sd" class="tile sd" hidden></div><div id="choices"></div></section>
<section><h2>표정 시트 · 30종</h2><p class="note">왼쪽 위부터 평상시·작은 웃음·걱정/의아함·놀람·짜증·집중/딴생각</p><div id="sheets"></div><h2>개별 SD 상황 컷 · 18종</h2><img id="sd-sheet" alt="각 인물이 혼자 지도·보호대·새 등을 살피는 SD 상황 시트"><img id="yeogyeong-sd-sheet" alt="차여경 개별 SD 상황 여섯 가지"></section>
</main></body></html>
