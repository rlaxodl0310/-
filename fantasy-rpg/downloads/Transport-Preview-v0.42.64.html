<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>운반 엔진 테스트 v0.42.64</title><style>body{background:#101c19;color:#eee;font:17px system-ui;max-width:800px;margin:40px auto;padding:20px}button,input,select{font:inherit;padding:10px;margin:5px}button{cursor:pointer}pre{white-space:pre-wrap;background:#20342b;padding:20px;border-radius:12px}small{color:#c8c7aa}</style><h1>부축·운반·인계 테스트</h1><p>게임과 동일한 공통 판정 엔진을 사용하는 독립 시제품입니다.</p><small>아래 수치는 테스트용이며 캐릭터 설정이나 본편 저장을 변경하지 않습니다. AI 동의·던전 시뮬레이션·치료는 이 시제품 범위에 포함하지 않습니다.</small><p>운반자 힘 <input id="strength" type="number" value="8" min="0"> 대상 무게(kg) <input id="weight" type="number" value="46" min="1"><label><input id="walking" type="checkbox">대상 보행 가능</label><select id="mode"><option value="carry">운반</option><option value="support">부축</option></select></p><button onclick="reset()">초기화</button><button onclick="act('assess')">상태 확인</button><button onclick="act('start')">부축·운반 시작</button><button onclick="act('move')">의료소까지 이동</button><button onclick="act('drop')">현재 위치에 내려놓기</button><button onclick="act('handover')">의료소 인계</button><pre id="result"></pre><script>(function(r,f){if(typeof module==='object'&&module.exports)module.exports=f();else r.TransportEngine=f();})(globalThis,()=>{
'use strict';const clone=x=>JSON.parse(JSON.stringify(x)),fail=m=>{throw Error(m);};
const policy=Object.freeze({version:1,baseCapacityKg:40,perStrengthKg:20,minCarrierHealthRatio:.25,supportFraction:.35,assessmentMinutes:5,handoverMinutes:5});
const same=(a,b)=>!!a&&!!b&&a.regionId===b.regionId&&(a.zoneId??null)===(b.zoneId??null);
function initial(){return{version:1,sequence:0,assessments:{},trips:{},events:[]};}
function event(w,t,at,kind){w.events.push({id:'transport-event-'+w.events.length,tripId:t?.id||null,targetId:t?.targetId||null,at,kind});}
function validActor(a){return a&&typeof a.id==='string'&&a.position&&typeof a.position.regionId==='string'&&Number.isFinite(a.hp)&&Number.isFinite(a.max)&&a.hp>=0&&a.max>0&&a.hp<=a.max;}
function capacity(a){if(!validActor(a)||!Number.isFinite(a.strength)||a.strength<0||!Number.isFinite(a.fatigue)||a.fatigue<0||a.fatigue>100)fail('운반자의 실제 힘·체력·피로 기록이 필요합니다.');if(a.canWalk===false)fail('스스로 이동할 수 없는 운반자입니다.');if(a.hp/a.max<policy.minCarrierHealthRatio||a.fatigue>=100)fail('부상·탈진 상태에서는 운반할 수 없습니다.');return(policy.baseCapacityKg+a.strength*policy.perStrengthKg)*(.5+.5*a.hp/a.max)*(1-a.fatigue/125);}
function quote(carrier,target,mode,baseMinutes=0){if(!validActor(target)||!Number.isFinite(target.weightKg)||target.weightKg<=0)fail('대상의 확인된 무게·상태가 필요합니다.');if(!['support','carry'].includes(mode)||mode==='support'&&!target.canWalk)fail('스스로 걸을 수 없는 대상은 부축할 수 없습니다.');if(!same(carrier.position,target.position)||carrier.id===target.id)fail('같은 실제 위치의 서로 다른 대상이어야 합니다.');const maxKg=capacity(carrier),loadKg=target.weightKg*(mode==='support'?policy.supportFraction:1),ratio=loadKg/maxKg;if(loadKg>maxKg)fail('현재 힘·부상·피로로는 이 무게를 감당할 수 없습니다.');if(!Number.isFinite(baseMinutes)||baseMinutes<0)fail('이동 시간이 잘못되었습니다.');const minutes=baseMinutes?Math.max(1,Math.ceil(baseMinutes*(1+ratio*(mode==='carry'?1:.5)))):0,fatigue=baseMinutes?Math.ceil(baseMinutes/10*(mode==='carry'?4:2)*(1+ratio)):0;
 if(baseMinutes&&(carrier.fatigue+fatigue>=100||loadKg>capacity({...carrier,fatigue:carrier.fatigue+fatigue})))fail('이 구간을 끝까지 운반할 힘이 부족합니다. 내려놓고 휴식하거나 다른 운반자가 필요합니다.');return{loadKg,maxKg,ratio,minutes,fatigue};}
function assess(world,target,at){if(!validActor(target))fail('현장에서 확인할 실제 대상 상태가 필요합니다.');const w=clone(world);w.assessments[target.id]={targetId:target.id,position:clone(target.position),hp:target.hp,max:target.max,weightKg:target.weightKg??null,canWalk:target.canWalk===true,at};return w;}
function begin(world,carrier,target,mode,metadata,at){const w=clone(world),a=w.assessments[target.id];if(!a||!same(a.position,target.position)||a.hp!==target.hp||a.weightKg!==target.weightKg)fail('현재 위치와 상태를 먼저 확인해 주세요.');if(Object.values(w.trips).some(t=>t.status==='active'&&[t.carrierId,t.targetId].some(id=>[carrier.id,target.id].includes(id))))fail('한 사람이 여러 운반 관계에 동시에 참여할 수 없습니다.');const q=quote(carrier,target,mode),id='transport-'+ ++w.sequence;w.trips[id]={id,carrierId:carrier.id,targetId:target.id,mode,status:'active',position:clone(target.position),weightKg:target.weightKg,canWalk:target.canWalk===true,startedAt:at,metadata:clone(metadata),pending:null,autoAt:metadata.auto?at+1:null,receipt:null,loadKg:q.loadKg};event(w,w.trips[id],at,'started');return w;}
function plan(world,id,carrier,target,route,at){const w=clone(world),t=w.trips[id];if(t?.status!=='active'||t.pending||carrier.id!==t.carrierId||target.id!==t.targetId||!same(t.position,carrier.position)||!same(carrier.position,route?.from)||!route.to||!route.key)fail('실제 운반 관계와 연결된 이동 경로가 필요합니다.');const q=quote(carrier,target,t.mode,route.baseMinutes);t.pending={route:clone(route),startedAt:at,endsAt:at+q.minutes,minutes:q.minutes,fatigue:q.fatigue};t.autoAt=null;event(w,t,at,'movement-started');return w;}
function complete(world,id,position,at){const w=clone(world),t=w.trips[id],p=t?.pending;if(t?.status!=='active'||!p||at<p.endsAt||!same(position,p.route.to))fail('실제 이동 완료 증빙이 필요합니다.');t.position=clone(position);t.history??=[];t.history.push({...p,completedAt:at});t.pending=null;t.autoAt=t.metadata.auto?at+1:null;event(w,t,at,'moved');return w;}
function stop(world,id,at,unresolved=false){const w=clone(world),t=w.trips[id];if(t?.status!=='active')fail('진행 중인 운반 관계가 없습니다.');t.status=unresolved?'unresolved':'grounded';t.pending=null;t.autoAt=null;t.stoppedAt=at;event(w,t,at,unresolved?'unresolved':'put-down');return w;}
function handover(world,id,carrier,target,receiver,at){const w=clone(world),t=w.trips[id];if(!t||!['active','grounded'].includes(t.status)||t.pending||carrier.id!==t.carrierId||target.id!==t.targetId||!same(carrier.position,t.position)||!same(target.position,t.position)||!same(receiver?.position,t.position)||!receiver.id||target.hp===0&&!receiver.canAcceptCritical)fail('같은 실제 위치의 적절한 인계 시설이 필요합니다.');t.status='delivered';t.pending=null;t.autoAt=null;t.receipt={authority:'engine',transportId:t.id,targetId:t.targetId,carrierId:t.carrierId,facilityId:receiver.id,position:clone(t.position),at};event(w,t,at,'handed-over');return w;}
function validate(w){if(!w||w.version!==1||!Number.isSafeInteger(w.sequence)||w.sequence<0||!w.assessments||!w.trips||!Array.isArray(w.events))fail('부축·운반 기록이 잘못되었습니다.');const busy=new Set();for(const [id,t]of Object.entries(w.trips)){if(t.id!==id||!['active','grounded','delivered','unresolved'].includes(t.status)||!['carry','support'].includes(t.mode)||t.carrierId===t.targetId||!t.position?.regionId||!Number.isFinite(t.weightKg)||t.weightKg<=0||!t.metadata||!Number.isFinite(t.startedAt))fail('운반 대상·위치 기록이 잘못되었습니다.');if(t.status==='active'){for(const actor of [t.carrierId,t.targetId]){if(busy.has(actor))fail('중복 운반 관계입니다.');busy.add(actor);}}if(t.pending&&(!Number.isFinite(t.pending.endsAt)||t.pending.endsAt<=t.pending.startedAt||!same(t.pending.route.from,t.position)))fail('운반 이동 시각·출발점이 잘못되었습니다.');if(t.status==='delivered'&&(t.receipt?.authority!=='engine'||t.receipt.targetId!==t.targetId||t.receipt.transportId!==id||!same(t.receipt.position,t.position)))fail('실제 인계 증빙이 잘못되었습니다.');}return w;}
return{policy,same,initial,capacity,quote,assess,begin,plan,complete,stop,handover,validate};
});
</script><script>let world,carrier,target,minutes;const output=document.getElementById('result');function show(message=''){const trip=Object.values(world.trips)[0];output.textContent=message+'\n경과 '+minutes+'분 / 위치 '+target.position.regionId+'\n대상 HP '+target.hp+' / 운반자 피로 '+carrier.fatigue+'\n상태 '+(trip?.status||'시작 전')+'\n'+(trip?.receipt?'실제 시설 인계 증빙 생성 · HP 회복 없음':'');}function reset(){world=TransportEngine.initial();minutes=0;carrier={id:'carrier',position:{regionId:'field'},hp:100,max:100,strength:Number(document.getElementById('strength').value),fatigue:0,canWalk:true};target={id:'patient',position:{regionId:'field'},hp:document.getElementById('walking').checked?60:0,max:100,weightKg:Number(document.getElementById('weight').value),canWalk:document.getElementById('walking').checked};show();}function act(type){try{const trip=Object.values(world.trips)[0];if(type==='assess'){minutes+=5;world=TransportEngine.assess(world,target,minutes);}if(type==='start')world=TransportEngine.begin(world,carrier,target,document.getElementById('mode').value,{auto:false},minutes);if(type==='move'){world=TransportEngine.plan(world,trip?.id,carrier,target,{key:'clinic',from:carrier.position,to:{regionId:'clinic'},baseMinutes:30},minutes);const pending=world.trips[trip.id].pending;minutes=pending.endsAt;carrier.position={regionId:'clinic'};target.position={regionId:'clinic'};carrier.fatigue+=pending.fatigue;world=TransportEngine.complete(world,trip.id,target.position,minutes);}if(type==='drop')world=TransportEngine.stop(world,trip?.id,minutes);if(type==='handover'){const next=TransportEngine.handover(world,trip?.id,carrier,target,{id:'medical-reception',position:{regionId:'clinic'},canAcceptCritical:true},minutes+5);minutes+=5;world=next;}TransportEngine.validate(world);show('완료');}catch(error){show(error.message);}}reset();</script></html>
