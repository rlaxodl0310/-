<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>던전 공통 엔진 테스트</title><style>body{margin:0;background:#101b19;color:#e5e8da;font:16px/1.6 system-ui;padding:24px;max-width:980px;margin:auto}h1{font-size:28px}button,select{padding:10px;margin:5px;border:1px solid #687663;background:#263a30;color:inherit;border-radius:5px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #47564a}.box{background:#1a2b25;border:1px solid #47564a;padding:16px;margin:18px 0;border-radius:8px}#message{color:#e8c580;min-height:26px}small{color:#aab8ad}</style><h1>던전 공통 엔진 테스트</h1><p>본편과 같은 독립 엔진을 사용하는 예시야. A·B는 테스트 파티이고, 전투 없는 두 구역으로 구성했어. 본편 세이브·ChatGPT 연결과는 분리되어 있어.</p><p>파티 선택 → 입장 → 핵 구역 이동 → 회수/권한 시험 → 핵 파괴 → 시간 진행 순서로 눌러봐. 핵 파괴 후 47시간59분과 48시간의 차이도 볼 수 있어.</p><label>조작 파티 <select id="party"><option value="a">테스트 파티 A</option><option value="b">테스트 파티 B</option></select></label><div class="box" id="controls"></div><p id="message" role="status"></p><div class="box" id="status"></div><table><thead><tr><th>파티</th><th>상태</th><th>구역</th><th>조사</th></tr></thead><tbody id="rows"></tbody></table><div class="box"><strong>엔진 사건</strong><div id="events"></div></div><script>(function(r,f){if(typeof module==='object'&&module.exports)module.exports=f();else r.DungeonEngine=f();})(globalThis,()=>{
'use strict';
const clone=x=>JSON.parse(JSON.stringify(x)),fail=m=>{throw Error(m);};
const policy=Object.freeze({collapseMinutes:48*60});
function initial(){return{version:1,sites:{},events:[]};}
function event(world,id,at,kind,data={}){world.events.push({id:'dungeon-event-'+world.events.length,dungeonId:id,at,kind,...data});}
function site(world,id){const d=world.sites[id];if(!d)fail('등록된 던전이 없습니다.');return d;}
function party(d,id){const p=d.parties[id];if(!p)fail('실제 등록된 공략 파티가 필요합니다.');return p;}
function live(d){if(d.stage!=='active'&&d.stage!=='collapsing')fail('이미 생태계로 전환된 던전입니다.');}
function create(world,spec,now){if(!Number.isFinite(now)||now<0)fail('던전 생성 시간이 잘못되었습니다.');const w=clone(world);if(w.sites[spec.id])return w;if(!spec.id||!spec.locationId||!spec.name||!['preserve','remove'].includes(spec.management)||!Array.isArray(spec.zones)||!spec.zones.length||new Set(spec.zones.map(z=>z.id)).size!==spec.zones.length||!spec.zones.some(z=>z.id===spec.coreZone))fail('던전 생성 데이터가 잘못되었습니다.');w.sites[spec.id]={...clone(spec),stage:'active',createdAt:now,destroyedAt:null,collapsesAt:null,destroyedBy:null,parties:{},permits:{},claims:{},cleared:{},battleReceipts:[],ecosystem:null};event(w,spec.id,now,'formed');return w;}
function advance(world,now){if(!Number.isFinite(now)||now<0)fail('게임 시간이 잘못되었습니다.');const w=clone(world);for(const d of Object.values(w.sites)){if(d.stage==='collapsing'&&now>=d.collapsesAt){d.stage='ecosystem';d.ecosystem={formedAt:d.collapsesAt,source:'dungeon-mana',surveyed:false};for(const p of Object.values(d.parties))if(p.phase==='inside')p.phase='unresolved';event(w,d.id,d.collapsesAt,'collapsed',{unresolvedParties:Object.values(d.parties).filter(p=>p.phase==='unresolved').map(p=>p.id)});}}return w;}
function enroll(world,id,data,now){const w=advance(world,now),d=site(w,id);live(d);if(!data.id||!Array.isArray(data.members)||!data.members.length||data.members.some(id=>typeof id!=='string'||!id.trim())||new Set(data.members).size!==data.members.length)fail('공략 파티 구성원이 필요합니다.');if(d.parties[data.id]){if(JSON.stringify(d.parties[data.id].members)!==JSON.stringify(data.members))fail('기존 공략 파티의 구성원을 덮어쓸 수 없습니다.');return w;}d.parties[data.id]={id:data.id,members:clone(data.members),phase:'outside',zone:null,explored:[],surveyed:[],victories:[]};event(w,id,now,'party-registered',{partyId:data.id});return w;}
function authorize(world,id,{partyId,contractId,issuer,expiresAt=Number.MAX_SAFE_INTEGER},now){const w=advance(world,now),d=site(w,id);live(d);party(d,partyId);if(d.management!=='remove'||issuer!=='association'||!contractId||!Number.isFinite(expiresAt)||expiresAt<now||d.stage!=='active')fail('협회의 유효한 핵 파괴 의뢰 권한이 필요합니다.');const key=partyId+':'+contractId;d.permits[key]={partyId,contractId,issuer,dungeonId:id,expiresAt};return w;}
function enter(world,id,partyId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId);if(p.phase!=='outside')fail('이미 내부에 있거나 결과 확인이 필요한 파티입니다.');if(Object.values(d.parties).some(other=>other.id!==p.id&&other.phase==='inside'&&other.members.some(member=>p.members.includes(member))))fail('같은 인물이 다른 공략 파티로 내부에 중복 진입할 수 없습니다.');p.phase='inside';p.zone=d.zones[0].id;if(!p.explored.includes(p.zone))p.explored.push(p.zone);event(w,id,now,'entered',{partyId});return w;}
function move(world,id,partyId,zoneId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId),zone=d.zones.find(z=>z.id===p.zone);if(p.phase!=='inside'||!zone?.neighbors.includes(zoneId)||!d.zones.some(z=>z.id===zoneId))fail('실제로 연결된 던전 구역으로 이동해 주세요.');const targetIndex=d.zones.findIndex(z=>z.id===zoneId),currentIndex=d.zones.findIndex(z=>z.id===p.zone);if(targetIndex>currentIndex&&zone.monsters.length&&!d.cleared[zone.id])fail('현재 구역의 위협을 해결하거나 입구 쪽으로 철수해 주세요.');p.zone=zoneId;if(!p.explored.includes(zoneId))p.explored.push(zoneId);event(w,id,now,'moved',{partyId,zoneId});return w;}
function survey(world,id,partyId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId);if(p.phase!=='inside')fail('실제 내부 구역에서 조사해 주세요.');if(p.surveyed.includes(p.zone))fail('이미 조사한 구역입니다.');p.surveyed.push(p.zone);event(w,id,now,'surveyed',{partyId,zoneId:p.zone});return w;}
function victory(world,id,partyId,{battleId,zoneId,monsters},now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId),z=d.zones.find(z=>z.id===zoneId);if(d.battleReceipts.includes(battleId))return w;if(p.phase!=='inside'||p.zone!==zoneId||!battleId||!z?.monsters.length||d.cleared[zoneId]||JSON.stringify(monsters)!==JSON.stringify(z.monsters))fail('현재 구역의 실제 전투 증빙이 필요합니다.');d.battleReceipts.push(battleId);d.cleared[zoneId]={partyId,battleId,at:now};p.victories.push({zoneId,battleId});event(w,id,now,'cleared',{partyId,zoneId,battleId});return w;}
function recover(world,id,partyId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId),z=d.zones.find(z=>z.id===p.zone);if(p.phase!=='inside'||!z?.resource||d.claims[z.resource]||z.monsters.length&&!d.cleared[z.id])fail('현재 구역의 회수 가능한 미소유 물품이 없습니다.');d.claims[z.resource]={partyId,zoneId:z.id,quantity:1,recoveredAt:now,delivered:false};event(w,id,now,'recovered',{partyId,resource:z.resource});return w;}
function destroyCore(world,id,partyId,contractId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId),z=d.zones.find(z=>z.id===d.coreZone);if(d.stage!=='active'||p.phase!=='inside'||p.zone!==d.coreZone||(!d.permits[partyId+':'+contractId]||d.permits[partyId+':'+contractId].expiresAt<now)||z.monsters.length&&!d.cleared[z.id])fail('핵 구역·위협 제거·협회 핵 파괴 권한을 확인해 주세요.');d.stage='collapsing';d.destroyedAt=now;d.collapsesAt=now+policy.collapseMinutes;d.destroyedBy={partyId,contractId};event(w,id,now,'core-destroyed',{partyId,contractId});return w;}
function exit(world,id,partyId,now){const w=advance(world,now),d=site(w,id);live(d);const p=party(d,partyId);if(p.phase!=='inside'||p.zone!==d.zones[0].id)fail('실제 입구까지 이동한 뒤 철수해 주세요.');p.phase='outside';p.zone=null;event(w,id,now,'exited',{partyId});return w;}
function validate(w){if(!w||w.version!==1||!w.sites||!Array.isArray(w.events))fail('던전 세계 기록이 잘못되었습니다.');for(const [id,d]of Object.entries(w.sites)){if(d.id!==id||!['active','collapsing','ecosystem'].includes(d.stage)||!['preserve','remove'].includes(d.management)||!Array.isArray(d.zones)||!d.zones.length||new Set(d.zones.map(z=>z.id)).size!==d.zones.length||!d.zones.some(z=>z.id===d.coreZone)||!Array.isArray(d.battleReceipts)||new Set(d.battleReceipts).size!==d.battleReceipts.length||!d.parties||!d.permits||!d.claims||!d.cleared)fail('던전 상태가 잘못되었습니다.');for(const z of d.zones)if(!Array.isArray(z.monsters)||!Array.isArray(z.neighbors)||z.neighbors.some(n=>!d.zones.some(other=>other.id===n&&other.neighbors.includes(z.id))))fail('던전 구역 연결이 잘못되었습니다.');if(d.stage==='active'&&(d.destroyedAt!==null||d.collapsesAt!==null)||d.stage!=='active'&&(!Number.isFinite(d.destroyedAt)||d.collapsesAt!==d.destroyedAt+policy.collapseMinutes||!d.permits[d.destroyedBy?.partyId+':'+d.destroyedBy?.contractId]))fail('핵 파괴·붕괴 시각이나 권한이 잘못되었습니다.');if(d.stage==='ecosystem'&&d.ecosystem?.formedAt!==d.collapsesAt)fail('새 생태계 형성 기록이 잘못되었습니다.');for(const [partyKey,p] of Object.entries(d.parties)){if(p.id!==partyKey||!['inside','outside','unresolved'].includes(p.phase)||!Array.isArray(p.members)||!p.members.length||!Array.isArray(p.explored)||!Array.isArray(p.surveyed)||!Array.isArray(p.victories)||new Set(p.members).size!==p.members.length||p.phase==='outside'&&p.zone!==null||p.explored.some(id=>!d.zones.some(z=>z.id===id))||p.surveyed.some(id=>!p.explored.includes(id))||p.victories.some(v=>d.cleared[v.zoneId]?.partyId!==p.id||d.cleared[v.zoneId]?.battleId!==v.battleId)||p.phase!=='outside'&&!d.zones.some(z=>z.id===p.zone))fail('공략 파티 위치·탐사 기록이 잘못되었습니다.');}for(const [key,permit] of Object.entries(d.permits))if(key!==permit.partyId+':'+permit.contractId||permit.dungeonId!==id||permit.issuer!=='association'||!d.parties[permit.partyId]||!Number.isFinite(permit.expiresAt)||d.management!=='remove')fail('핵 파괴 허가 기록이 잘못되었습니다.');for(const [zoneId,clear] of Object.entries(d.cleared))if(!d.zones.some(z=>z.id===zoneId)||!d.parties[clear.partyId]||!d.battleReceipts.includes(clear.battleId))fail('공략 구역 전투 기록이 잘못되었습니다.');for(const [key,c] of Object.entries(d.claims))if(!d.zones.some(z=>z.resource===key&&z.id===c.zoneId)||!d.parties[c.partyId]||c.quantity!==1||!d.zones.some(z=>z.id===c.zoneId)||typeof c.delivered!=='boolean')fail('던전 회수품 소유권이 잘못되었습니다.');}return w;}
return{policy,initial,create,advance,enroll,authorize,enter,move,survey,victory,recover,destroyCore,exit,validate};
});
</script><script>
'use strict';const E=DungeonEngine,spec={id:'demo',name:'독립 엔진 예시',locationId:'example',management:'remove',coreZone:'core',zones:[{id:'entry',name:'입구',neighbors:['core'],monsters:[]},{id:'core',name:'핵 구역',neighbors:['entry'],monsters:[],resource:'one-sample'}]};let state,minute;const $=id=>document.getElementById(id);function reset(){minute=0;state=E.create(E.initial(),spec,0);for(const id of ['a','b'])state=E.enroll(state,'demo',{id,members:[id+'-tester']},0);$('message').textContent='초기화했어. 예시 회수품은 한 개야.';draw();}function apply(fn){try{state=fn();E.validate(state);$('message').textContent='엔진이 처리했어.';}catch(e){$('message').textContent=e.message;}draw();}function draw(){const d=state.sites.demo;$('status').textContent='경과 '+minute+'분 · '+({active:'핵 유지',collapsing:'핵 파괴/붕괴 대기',ecosystem:'붕괴/미조사 새 생태계'})[d.stage]+' · '+(d.collapsesAt===null?'붕괴 시계 없음':'붕괴까지 '+Math.max(0,d.collapsesAt-minute)+'분')+' · 회수품 소유: '+(d.claims['one-sample']?.partyId||'미소유');$('rows').replaceChildren();for(const p of Object.values(d.parties)){const row=document.createElement('tr');for(const v of [p.id,p.phase,p.zone||'외부',p.surveyed.join(', ')||'없음']){const td=document.createElement('td');td.textContent=v;row.append(td);}$('rows').append(row);}$('events').replaceChildren();for(const e of state.events.slice(-12)){const p=document.createElement('div');p.textContent=e.at+'분 · '+e.kind+(e.partyId?' · '+e.partyId:'');$('events').append(p);}}const actions=[['입장',id=>E.enter(state,'demo',id,minute)],['핵 구역 이동',id=>E.move(state,'demo',id,'core',minute)],['조사',id=>E.survey(state,'demo',id,minute)],['조사물 회수',id=>E.recover(state,'demo',id,minute)],['테스트 협회 허가 발행',id=>E.authorize(state,'demo',{partyId:id,contractId:'test-contract-'+id,issuer:'association'},minute)],['핵 파괴',id=>E.destroyCore(state,'demo',id,'test-contract-'+id,minute)],['입구 이동',id=>E.move(state,'demo',id,'entry',minute)],['입구 밖 철수',id=>E.exit(state,'demo',id,minute)]];for(const [label,fn]of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>apply(()=>fn($('party').value));$('controls').append(b);}for(const [label,n]of [['1분 경과',1],['1시간 경과',60],['47시간59분 경과',2879],['48시간 경과',2880]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>apply(()=>{minute+=n;return E.advance(state,minute)});$('controls').append(b);}const b=document.createElement('button');b.textContent='초기화';b.onclick=reset;$('controls').append(b);reset();</script></html>
