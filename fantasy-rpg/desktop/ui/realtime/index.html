<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>이세계 기록 · 실시간 전투</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../roles/style.css"><script defer src="../data.js"></script><script defer src="../monsters/essence-rules.js"></script><script defer src="../battle/roster.js"></script><script defer src="../battle/cast-sprites.js"></script><script defer src="../battle/ant-sprite.js"></script><script defer src="../battle/clad-sprite.js"></script><script defer src="../battle/new-monster-sprites.js"></script><script defer src="../battle/additional-monster-sprites.js"></script><script defer src="../battle/feedback.js"></script><script defer src="../combat/stats.js"></script><script defer src="../skills/resources.js"></script><script defer src="../skills/common-data.js"></script><script defer src="../skills/common.js"></script><script defer src="../skills/common-battle.js"></script><script defer src="../skills/../combat/rules.js"></script><script defer src="../skills/../combat/install.js"></script><script defer src="../skills/system.js"></script><script defer src="../skills/effects.js"></script><script defer src="../progression/model.js"></script><script defer src="engine.js"></script><script defer src="../roles/model.js"></script><script defer src="../roles/ui.js"></script><script defer src="app.js"></script></head><body><canvas id="arena" aria-label="실시간 이동과 회피로 싸우는 전장"></canvas><div id="rt-effects" aria-hidden="true"></div><header><div><strong>실시간 전투</strong><small>본편 저장과 분리된 전투 시제품</small></div><nav><button id="pause-toggle">일시정지 · P</button><button id="settings-open">전투 설정</button><button id="grid-return">격자 전투</button></nav></header><div id="rt-party-roles" aria-label="전투 파티 역할" hidden></div><section id="player-hud"><b>김태이</b><div class="hp"><i id="hp-lag"></i><i id="hp-fill"></i></div><span id="health"></span><div class="mp"><i id="mp-fill"></i></div><span id="dodge-state"></span></section><div id="rt-status" role="status"></div><aside id="pause-panel" hidden aria-label="전투 일시정지와 상태"><h2>상태와 명령</h2><p>명령은 재개할 때 다시 검사합니다. 인물마다 마지막 명령 하나를 예약합니다.</p><label>공격 대상 <select id="pause-target" aria-label="예약 명령의 적 대상"></select></label><div id="pause-roster"></div><div id="pause-orders"></div></aside><section id="moment" hidden aria-label="전투 기회"><strong id="moment-title"></strong><span id="moment-time"></span><div id="moment-choices"></div></section><div class="rt-controls"><div id="rt-actions"><button id="attack">공격 <kbd>J</kbd></button><button id="skill-q">스킬 <kbd>Q</kbd></button><button id="skill-e">스킬 <kbd>E</kbd></button><button id="dodge">회피 <kbd>Space</kbd></button></div><div id="registered-skills" aria-label="등록된 개인 스킬"></div><p>WASD / 방향키 이동 · 적 클릭 대상 선택 · J 공격 · Q/E 스킬 · Space 회피</p><p id="message" role="status">적의 준비 동작을 보고 움직이세요. P로 멈춰 상태와 명령을 확인할 수 있습니다.</p><form id="tactic-form"><select id="command-actor" aria-label="명령 대상"><option value="taei">김태이</option></select><select id="aim-part" aria-label="노릴 부위"><option value="torso">몸통</option><option value="shoulder">어깨</option><option value="head">머리</option><option value="neck">목</option><option value="chest">가슴</option><option value="abdomen">복부</option><option value="arm">팔</option><option value="leg">다리</option></select><select id="tactic-mode" aria-label="행동 해석"><option value="local">로컬 전술 해석</option><option value="ai">ChatGPT 의도 해석</option></select><input id="tactic-input" maxlength="500" placeholder="행동 시도 입력 · 예: 다음 기회에 옆으로 흘리고 싶어" aria-label="창의적인 전투 행동 입력"><button id="tactic-send">시도</button><button id="tactic-cancel" type="button" hidden>해석 취소</button></form><p id="tactic-result" role="status"></p><div class="touch-move" aria-label="이동"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div><dialog id="rt-settings"><h2>새 실시간 전투</h2><p>P 또는 일시정지 버튼으로 전투를 멈추고 상태·예약 명령을 확인할 수 있습니다.</p><label>태이 시험 장비<select id="rt-weapon"><option value="gauntlet">건틀릿</option><option value="bow">활</option><option value="magic">마법</option><option value="sword">검</option><option value="spear">창</option><option value="shield">방패</option></select></label><label>민첩 · 시험용<input id="rt-agility" type="number" min="1" max="100" value="10"></label><label>상대 종류<select id="rt-monster"></select></label><label>개체 수<select id="rt-count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>전투 배경<select id="rt-biome"><option value="0">초원</option><option value="1">달빛 유적</option><option value="2">수정 동굴</option><option value="3">공허 평원</option></select></label><div id="rt-allies"></div><details id="rt-role-settings"><summary>현재 시험 파티 역할 배치</summary><div id="rt-role-editor"></div></details><p>동료는 최대 3명. 장비는 시험용이며 캐릭터 설정을 확정하지 않습니다.</p><button id="rt-start">새 전투 시작</button><button id="rt-close">돌아가기</button></dialog></body></html>
